<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面（試作）</title>
<style>
  :root { --ink:#1f2933; --sub:#52606d; --line:#d9e2ec; --bg:#f7f9fb; --ai:#fffaf0; --ai-line:#f0c36d; --accent:#1d6fb8; --lock:#eef1f4; --app:#6b4fa0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .note { font-size:12px; color:#b4472b; }
  .wrap { display:grid; grid-template-columns: 1fr 440px; min-height:calc(100vh - 56px); }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }
  .admin { padding:14px 16px 40px; overflow-x:hidden; }
  .side { background:#fff; border-left:1px solid var(--line); padding:14px 16px 40px; }
  @media (max-width:900px){ .side{ border-left:none; border-top:2px solid var(--line); } }
  h2 { font-size:14px; margin:20px 0 8px; color:var(--sub); }
  h2 .who { font-size:11px; font-weight:normal; padding:1px 6px; border-radius:8px; margin-left:6px; }
  .who.shop { background:#e6f0fa; color:var(--accent); }
  .who.app { background:#efe9f7; color:var(--app); }
  .who.common { background:var(--lock); color:var(--sub); }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg label { border:1px solid var(--line); background:#fff; border-radius:6px; padding:7px 10px; font-size:13px; cursor:pointer; }
  .seg input { margin-right:4px; }
  .seg label.on { border-color:var(--accent); background:#e6f0fa; }
  .seg small { display:block; color:var(--sub); font-size:11px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
  .box.lock { background:var(--lock); }
  .box.app { border-color:#d6c8ec; background:#faf7fd; font-size:13px; }
  .box.app li { margin:2px 0; }
  .head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .num { font-size:18px; color:#c0392b; }
  .head .title { font-size:13px; color:var(--sub); }
  .head input.topic { flex:1; min-width:0; font-size:13px; padding:5px 7px; border:1px dashed var(--line); border-radius:4px; color:var(--sub); }
  .slots { display:flex; flex-wrap:wrap; gap:4px; }
  /* 最低の幅を確保し、文字の長さに合わせて広がる */
  .slots input { field-sizing:content; min-width:9em; max-width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; font-size:13px; }
  .slots input:placeholder-shown { background:#fbfbfb; border-style:dashed; }
  .slots span.fixedbtn { display:inline-block; min-width:9em; padding:6px 8px; border:1px solid var(--line); border-radius:4px; font-size:13px; background:#fff; color:var(--sub); }
  .branch { font-size:12px; color:var(--sub); margin:6px 0 2px; }
  button { font-size:13px; padding:7px 11px; border-radius:6px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; margin:4px 4px 0 0; }
  button.plus { width:100%; border-style:dashed; margin-top:2px; }
  button.small { font-size:12px; padding:3px 8px; }
  .hint { font-size:12px; color:var(--sub); }
  textarea { width:100%; padding:7px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  /* 右側 */
  .tabs { display:flex; gap:4px; margin-bottom:10px; }
  .tabs button { margin:0; flex:1; }
  .tabs button.on { background:var(--accent); color:#fff; }
  .side h3 { font-size:13px; margin:14px 0 4px; }
  .side h3 .num { font-size:15px; margin-right:2px; }
  .side p { font-size:13px; line-height:1.7; margin:2px 0 6px; }
  .side .ex { font-size:12px; color:var(--sub); background:var(--bg); border-left:3px solid var(--line); padding:4px 8px; margin:2px 0 8px; }
  /* 試す（利用者の画面） */
  .notice { font-size:12px; background:#fff4e5; border:1px solid #f0c36d; border-radius:6px; padding:6px 8px; margin-bottom:8px; }
  .fixed { font-size:13px; color:var(--sub); background:var(--lock); border-radius:6px; padding:6px 10px; margin:4px 0; }
  .ai { background:var(--ai); border-left:4px solid var(--ai-line); padding:9px 11px; margin:10px 0 4px; font-size:14px; line-height:1.7; border-radius:4px; }
  .ai .tag { font-size:11px; color:#a0701a; display:block; }
  .ai .dummy { color:var(--sub); }
  .me { text-align:right; margin:8px 0; font-size:14px; }
  .me span { background:#e6f0fa; padding:6px 10px; border-radius:12px; display:inline-block; }
  .row { margin:4px 0 2px; }
  .row .num { margin-right:4px; vertical-align:middle; }
  .row.done button { opacity:.45; pointer-events:none; }
  .row.done button.chosen { opacity:1; background:var(--accent); color:#fff; }
  .row.done .textline { display:none; }
  .textline { display:flex; gap:4px; margin-top:6px; }
  .textline input { flex:1; min-width:0; padding:7px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .textline button { margin:0; }
  .inq { border:1px dashed var(--accent); border-radius:6px; padding:8px 10px; margin-top:14px; font-size:13px; }
  .inq b { color:var(--accent); }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>管理画面 ― 試作（コンテンツ：3 AI型）</h1>
  <div class="note">左の番号は、利用者の画面の番号と同じです。右上の「利用者画面」で、設定どおりに動くかを確かめられます（設定はこのブラウザに保存され、利用者画面が読みます）。AIの返事はダミーです。</div>
</header>
<div class="wrap">
  <main class="admin">
    <h2>業態モード <span class="who shop">店が選ぶ</span></h2>
    <div class="seg" id="modes"></div>

    <h2>ロケーション <span class="who common">全業態共通・変更なし</span></h2>
    <div id="common"></div>

    <h2>選択肢 <span class="who shop">店が書く</span></h2>
    <div id="steps"></div>
    <button class="plus" id="addStep">＋ ステップを足す</button>

    <h2>往復の上限 <span class="who shop">店が変えられる</span></h2>
    <div class="box"><input id="limit" type="number" min="1" style="width:5em"> 往復まで <span class="hint" id="limitNote"></span></div>

    <h2>問い合わせで出す店の一手 <span class="who shop">店が書く</span></h2>
    <textarea id="close" rows="2"></textarea>

    <h2>アプリが持つ決まり <span class="who app">店は変えられない</span></h2>
    <div class="box app" id="rules"></div>
  </main>

  <aside class="side">
    <div class="tabs"><button class="on">設定の説明</button><button onclick="window.open('./', 'reUser')">利用者画面 ↗</button></div>
    <div id="help"></div>
  </aside>
</div>

<script>
// ---- 業態モード 4＋1（Claude.AI「業態モードの分け方」）。④⑤の初期値は Claude Code の仮置き ----
const MODES = {
  m1: { name:"物件情報をいち早く届ける店", sub:"仲介情報屋",
    steps:[ { topic:"市場でどう動くか", btns:["売り出すならいつがよいか","似た土地の動き","買い手がいるか","今の値段の目安"] },
            { topic:"売る時期", btns:["すぐにでも","半年〜1年のうちに","時期は決めていない"] } ],
    close:"近い条件の買い手の動きと、売り出しの段取りを持って伺います。" },
  m2: { name:"土地を買い取り、形にする店", sub:"開発優先",
    steps:[ { topic:"まとめると何ができるか", btns:["この土地で何が建つか","お隣と合わせたら","買い取りの目安","買い取りと仲介の違い"] },
            { topic:"急ぎ具合", btns:["早く現金にしたい","時間がかかっても高く","比べてから決めたい"] } ],
    close:"買い取りの目安をお出しします。お隣と合わせた開発もご提案します。" },
  m3: { name:"土地の活かし方から一緒に考える店", sub:"総合系",
    steps:[ { topic:"活かし方", btns:["住む・建て直す","建てて貸す","建てずに貸す（駐車場など）","売る","お隣と合わせる"] },
            { topic:"次に知りたいこと", btns:["かかる費用の目安","手順と期間","似た土地の例"] } ],
    close:"接道の条件で、選べる活かし方を現地で一緒に絞ります。" },
  m4: { name:"相続や税の相談から始める店", sub:"相続・税務起点",
    steps:[ { topic:"誰の名義か", btns:["自分の名義","親や亡くなった家族の名義","兄弟などと共有","わからない"] },
            { topic:"家族の考えと期限", btns:["期限がある（相続税の申告など）","家族で意見が分かれている","まだ話していない"] } ],
    close:"名義の整理から、司法書士・税理士と一緒に伺います。" },
  m5: { name:"一から自分で作る店", sub:"＋1",
    steps:[ { topic:"", btns:[] }, { topic:"", btns:[] } ], close:"" }
};
const END = "セッションでお答えできるのは以上です。詳しくは弊社へお問い合わせください。";
const NUM = "⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
// ロケーション（index.html と同じ問いとボタン）。②は①の答えで変わる
const LOC = {
  1: { title:"道への接し方", btns:["道に広く面している","細い通路の奥にある（旗竿地）","わからない"] },
  2: { title:"道の幅", branches:[
        { when:"①で「細い通路の奥」", title:"通路の幅", btns:["2mある","2mない・狭い","測ったことがない"] },
        { when:"①で「道に広く面している」", title:"前の道", btns:["すれ違える","すれ違えない","わからない"] } ],
       skip:"①で「わからない」なら②は飛ばして③へ" },
  3: { title:"建物", btns:["住んでいる家がある","空き家・古い家がある","何もない（更地）"] }
};
const FIRST = 4; // 店が書く選択肢は④から

let modeKey = "m3", steps = [], closeText = "", limit = null; // limit: null＝初期値（自動）
function loadMode(k) {
  modeKey = k;
  steps = MODES[k].steps.map(s => ({ topic:s.topic, btns:[...s.btns, "", ""] })); // 初期値＋空白2つ
  closeText = MODES[k].close;
  limit = null;
}
// 初期値：ボタンを書いたステップの数＋2（＋で足したステップも数える）
const autoLimit = () => steps.filter(s => live(s).length).length + 2;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const live = s => s.btns.map(b => b.trim()).filter(Boolean);
const fixedBtns = list => list.map(b => `<span class="fixedbtn">${esc(b)}</span>`).join("");

// ---- 管理画面 ----
function renderAdmin() {
  const m = document.getElementById("modes");
  m.innerHTML = "";
  for (const [k, v] of Object.entries(MODES)) {
    const l = document.createElement("label");
    l.className = k === modeKey ? "on" : "";
    l.innerHTML = `<input type="radio" name="mode"${k === modeKey ? " checked" : ""}>${v.name}<small>${v.sub}</small>`;
    l.onclick = e => { e.preventDefault(); if (k !== modeKey) { loadMode(k); renderAll(); } };
    m.appendChild(l);
  }
  document.getElementById("common").innerHTML =
    `<div class="box lock"><div class="head"><span class="num">⓪</span><span class="title">市区町村・地図・ピン</span></div><div class="hint">利用者が市区町村を選び、地図に土地のピンを立てる。</div></div>`
    + [1, 2, 3].map(n => {
      const s = LOC[n];
      const body = s.branches
        ? s.branches.map(b => `<div class="branch">${b.when} → ${b.title}</div><div class="slots">${fixedBtns(b.btns)}</div>`).join("") + `<div class="branch">${s.skip}</div>`
        : `<div class="slots">${fixedBtns(s.btns)}</div>`;
      return `<div class="box lock"><div class="head"><span class="num">${NUM[n]}</span><span class="title">${s.title}</span></div>${body}</div>`;
    }).join("");
  const box = document.getElementById("steps");
  box.innerHTML = "";
  steps.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "box";
    d.innerHTML = `<div class="head"><span class="num">${NUM[FIRST + i]}</span><input class="topic" placeholder="題名（管理用の呼び名・利用者の画面に出ない）" value="${esc(s.topic)}"></div><div class="slots"></div><button class="small">＋ 枠を足す</button>`;
    d.querySelector(".topic").oninput = e => { s.topic = e.target.value; save(); };
    const slots = d.querySelector(".slots");
    s.btns.forEach((b, j) => {
      const inp = document.createElement("input");
      inp.value = b; inp.placeholder = "（空白）";
      inp.size = Math.max(b.length * 2, 8); // field-sizing が効かないブラウザ向け
      inp.oninput = () => { s.btns[j] = inp.value; inp.size = Math.max(inp.value.length * 2, 8); resetTry(); if (limit == null) document.getElementById("limit").onchange(); };
      slots.appendChild(inp);
    });
    d.querySelector("button").onclick = () => { s.btns.push(""); renderAdmin(); };
    box.appendChild(d);
  });
  document.getElementById("addStep").textContent = `＋ ステップを足す（${NUM[FIRST + steps.length]}）`;
  const lm = document.getElementById("limit");
  const showLimit = () => {
    lm.value = limit ?? autoLimit();
    document.getElementById("limitNote").textContent = limit == null ? `（初期値：ボタンのあるステップ ${autoLimit() - 2}＋2）` : "（店が変更）";
  };
  showLimit();
  lm.oninput = () => { const v = parseInt(lm.value, 10); limit = v > 0 ? v : null; save(); };
  lm.onchange = showLimit;
  const cl = document.getElementById("close");
  cl.value = closeText;
  cl.oninput = () => { closeText = cl.value; resetTry(); };
  document.getElementById("rules").innerHTML = `<ul style="margin:0;padding-left:18px">
    <li>立ち位置：売り逃げ・詐欺まがいの相談には協力しない</li>
    <li>返事の形：短文／入力に対する回答／問いかけ</li>
    <li>問いかけの答えは、次のステップのボタンになる（誘導）</li>
    <li>店のボタンが尽きたら、AIがボタン候補を出して選択＋メッセージを続ける</li>
    <li>往復の上限に来たら「${END}」で打ち切る</li>
    <li>利用者が書いた個人情報は、返事で繰り返さない。名前や連絡先を問いで聞かない</li>
    <li>原文は残さない。会話全体の総合判断を毎回更新して残す。統計には札と粗い位置だけ</li>
  </ul>`;
}
document.getElementById("addStep").onclick = () => { steps.push({ topic:"", btns:["", ""] }); renderAll(); };

// ---- 右側：設定の説明（概要と項目説明） ----
function renderHelp() {
  const last = NUM[FIRST + steps.length - 1];
  document.getElementById("help").innerHTML = `
    <h3>概要</h3>
    <p>AI型コンテンツの設定画面です。利用者は地図に土地のピンを立て、番号の順にボタンを押して相談を進めます。AIは利用者の答えに短く答え、最後に次のボタンを話題として示します。</p>
    <p>左の番号は、利用者の画面の番号と同じです。設定したら「利用者画面」を開き、同じ番号の所がどう出るかを確かめてください。管理画面で書き換えると、開いている利用者画面は最初から読み直されます。</p>
    <h3>業態モード</h3>
    <p>店の得意な方向を選びます。選ぶと、④から先の選択肢と店の一手に初期値が入ります。初期値は書き換えられます。</p>
    <div class="ex">例：「土地の活かし方から一緒に考える店」→ ④に「住む・建て直す」「建てて貸す」など</div>
    <h3><span class="num">⓪</span>〜<span class="num">③</span> ロケーション</h3>
    <p>土地の形に掛かる事実（道への接し方、道の幅、建物）を聞きます。どの業態でも同じで、変えられません。②は①の答えで問いが変わります。</p>
    <h3><span class="num">④</span>〜<span class="num">${last}</span> 選択肢</h3>
    <p>利用者を店の得意な方向へ引き寄せる問いです。各ステップのボタンの言葉を書きます。空白の枠は利用者の画面に出ません。題名は管理用の呼び名で、利用者の画面には出ません。</p>
    <p>AIは一つ前の答えに答えた後、このステップのボタンを話題として示します。</p>
    <div class="ex">例：（回答）「住む・建て直す」や「建てて貸す」・「売る」などについてお話ししましょう。</div>
    <p>各ステップの下に記入欄が付きます。利用者が書いても、AIは答えた後、次のボタンへ戻します。</p>
    <h3>＋ ステップを足す</h3>
    <p>次の番号のステップが増えます。ボタンを書けば、会話はそこまで店の言葉で進みます。ボタンが書かれていないステップでは、AIがボタン候補を出して続けます。</p>
    <h3>往復の上限</h3>
    <p>会話を何往復で終えるかです。初期値は「ボタンを書いたステップの数＋2」で、ステップを足してボタンを書くと増えます。数を書き換えると、その数に固定されます。上限に来たら、AIは回答の後に次の文で打ち切ります。</p>
    <div class="ex">${END}</div>
    <h3>問い合わせで出す店の一手</h3>
    <p>④から下に常に出る「これらの情報をもとにお問い合わせ」に添える一文です。問い合わせると、店が何をしてくれるかを書きます。</p>
    <h3>アプリが持つ決まり</h3>
    <p>AIの返事の形、立ち位置、個人情報の扱いです。どの店でも同じで、変えられません。</p>`;
}

// ---- 利用者画面（index.html）へ連動：設定をこのブラウザに保存し、利用者画面が読む ----
function save() { try { localStorage.setItem("reAdmin", JSON.stringify({ mode:modeKey, steps, close:closeText, limit })); } catch (e) {} }
function resetTry() { save(); }

function renderAll() { renderAdmin(); renderHelp(); save(); }
loadMode("m3");
try { const sv = JSON.parse(localStorage.getItem("reAdmin")); if (sv && MODES[sv.mode]) { modeKey = sv.mode; steps = sv.steps; closeText = sv.close; limit = sv.limit ?? null; } } catch (e) {}
renderAll();
</script>
</body>
</html>
