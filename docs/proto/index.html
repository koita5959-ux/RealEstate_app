<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土地の見立て（試作）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#1f2933; --sub:#52606d; --line:#d9e2ec; --bg:#f7f9fb; --ai:#fffaf0; --ai-line:#f0c36d; --accent:#1d6fb8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); }
  body { display:flex; flex-direction:column; height:100vh; }
  .wrap { display:grid; grid-template-columns: 1fr 440px; flex:1; min-height:0; }
  #map { height:100%; }
  aside { overflow-y:auto; padding:14px 16px 40px; background:#fff; border-left:1px solid var(--line); }
  @media (max-width:820px){ body{ display:block; height:auto; } .wrap{ grid-template-columns:1fr; height:auto; } #map{ height:45vh; } aside{ border-left:none; } }
  h2 { font-size:14px; margin:18px 0 8px; color:var(--sub); }
  label { font-size:13px; display:block; margin:6px 0 2px; }
  input[type=number], textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
  button { font-size:14px; padding:9px 12px; border-radius:6px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; margin:4px 4px 0 0; }
  button.primary { background:var(--accent); color:#fff; width:100%; margin-top:10px; }
  button:disabled { opacity:.4; cursor:default; }
  button.off, button.off:hover { background:#c3c9d0 !important; color:#fff !important; border-color:#c3c9d0 !important; cursor:not-allowed; opacity:1; }
  .data { width:100%; border-collapse:collapse; font-size:13px; }
  .data td { border-bottom:1px solid var(--line); padding:5px 4px; }
  .data td:first-child { color:var(--sub); width:42%; }
  .ai { background:var(--ai); border-left:4px solid var(--ai-line); padding:10px 12px; margin:10px 0 4px; font-size:15px; line-height:1.7; border-radius:4px; }
  .ai .tag { font-size:11px; color:#a0701a; display:block; margin-bottom:2px; }
  .me { text-align:right; margin:8px 0; font-size:14px; }
  .me span { background:#e6f0fa; padding:6px 10px; border-radius:12px; display:inline-block; }
  .hint { font-size:12px; color:var(--sub); }
  .sheet { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:13px; }
  .sheet h3 { font-size:13px; margin:8px 0 4px; }
  .empty { color:#b4472b; }
  .will { display:none; font-size:12px; color:#6b4fa0; border-top:1px dotted #6b4fa0; margin-top:6px; padding-top:4px; }
  body.design .will { display:block; }
  .row.done button { opacity:.45; }
  .row button.sel { background:#b9d5f0; border-width:2px; }
  .row.done button.chosen { opacity:1; background:var(--accent); color:#fff; }
  .row.done textarea { display:none; }
  .row.done > button:only-of-type, .row.done .hint { display:none; }
  .route { font-size:13px; background:#eef4fb; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-top:12px; line-height:1.7; }
  .route:empty { display:none; }
  .qnum { display:inline-block; font-size:20px; color:#c0392b; margin-right:6px; vertical-align:middle; }
  .opt { display:inline-block; min-width:18px; height:18px; line-height:18px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; text-align:center; margin-right:6px; }
  .row.done button.chosen .opt { background:#fff; color:var(--accent); }
  button.demo-next { outline:3px solid #c0392b; outline-offset:2px; }
  .demo { position:fixed; left:12px; bottom:12px; max-width:380px; z-index:1000; background:#2b2a26; color:#f4f0e6; font-size:13px; line-height:1.6; padding:10px 14px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .demo span { color:#e6c98f; }
  .demo-badge { display:inline-block; color:#fff; background:#c0392b; border-radius:50%; width:24px; height:24px; text-align:center; line-height:24px; font-size:15px; margin-right:2px; vertical-align:middle; }
  .hidden { display:none; }
  .textline { display:flex; gap:4px; margin-top:6px; }
  .textline button { margin:0; }
  input.other[type=text] { flex:1; min-width:0; margin:0; padding:7px; }
  .row.done input.other, .row.done .textline button:not(.chosen) { display:none; }
  input[type=text], input[type=email], input[type=tel], select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; margin-bottom:4px; }
  button.small { font-size:12px; padding:5px 10px; }
  button.inq { width:100%; margin-top:18px; border-style:dashed; }
  #inq { border-top:1px solid var(--line); margin-top:16px; }
  details { font-size:12px; color:var(--sub); margin-top:16px; }
  .logline { font-size:12px; color:var(--sub); padding:4px 14px; border-bottom:1px solid var(--line); flex:none; }
  .logline .note { font-size:12px; color:#b4472b; margin-left:10px; }
</style>
</head>
<body>
<header id="appbar" data-current="user" data-title="土地の見立て ― 試作">
  <span class="appextra"><label><input type="checkbox" onchange="document.body.classList.toggle('design', this.checked)"> 設計メモ（渡したもの／開けた穴）</label></span>
</header>
<script src="shell.js"></script>
<div class="logline">入力内容を含む、機能改善のためのログを自動で記録します。開発調査に利用させていただきます。<span class="note">①〜③は台本、④からの返事はAI（Claude）です。数値は仮データで実在しません。</span></div>
<div class="wrap">
  <div id="map"></div>
  <aside>
    <div id="step0">
      <h2>0. 土地のある市区町村</h2>
      <label for="prefName">都道府県</label>
      <input id="prefName" type="text" placeholder="例：岐阜県" autocomplete="off">
      <label for="cityName">市区町村</label>
      <input id="cityName" type="text" placeholder="例：岐阜市" autocomplete="off">
      <button id="openMap" class="primary">地図を開く</button>
      <div id="mapMsg" class="hint"></div>
    </div>
    <div id="step1" class="hidden">
      <h2>1. 地図をクリックして場所を指定</h2>
      <button id="preset" class="small">例：鷺山の旗竿地にピンを置く</button>
      <div id="picked" class="hint">まだ指定されていません（岐阜市内）</div>
      <label for="area">面積（㎡）</label>
      <input id="area" type="number" value="120" min="10">
      <button id="go" class="primary off">評価する</button>
    </div>
    <div id="route" class="route"></div>
    <div id="result"></div>
    <details>
      <summary>事業所設定（プレファレンス・仮）</summary>
      <pre id="prefView"></pre>
    </details>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// 開き直し・リロード＝新しい体験。前の体験の記録は消す（「利用状況」は、評価するまでグレー）
try { localStorage.removeItem("reSession"); } catch (e) { /* 何もしない */ }
if (window.Shell) Shell.refresh();
// ---- 仮データ（実在しない数値） ----
const POINTS = [
  { name:"岐阜駅前",  lat:35.4095, lng:136.7564, price:300000, zone:"商業地域" },
  { name:"柳ケ瀬",    lat:35.4237, lng:136.7608, price:180000, zone:"商業地域" },
  { name:"長良",      lat:35.4430, lng:136.7700, price:120000, zone:"第一種住居地域" },
  { name:"鷺山",      lat:35.4480, lng:136.7350, price:80000,  zone:"第一種低層住居専用地域" },
  { name:"茜部",      lat:35.3900, lng:136.7500, price:90000,  zone:"第一種住居地域" },
];
// 事業所の土地勘（プレファレンス）
const PREF = {
  office: "（仮）〇〇不動産",
  strengths: ["売買仲介", "隣地との一体活用の提案"],
  localKnowledge: {
    "長良": "川沿いは景観で指名買いがある。北側の駐車場は所有者が売却に前向き。",
    "鷺山": "旗竿地が多く相場より厳しく見られがち。隣地取得で化ける例を複数扱った。",
    "茜部": "幹線沿いは店舗需要あり。奥は住宅地として落ち着いている。",
    "柳ケ瀬": "空き店舗の転用相談が増えている。",
    "岐阜駅前": "狭小地でも収益物件の引き合いがある。"
  },
  tone: "踏み込むが嘘はつかない"
};
document.getElementById("prefView").textContent = JSON.stringify(PREF, null, 2);

function distM(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// ---- 地図 ----
const map = L.map("map").setView([35.423, 136.760], 13);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>', maxZoom: 18
}).addTo(map);
POINTS.forEach(p => L.circleMarker([p.lat, p.lng], { radius:6, color:"#888" }).addTo(map).bindTooltip("標準地(仮) " + p.name));
let pin = null, here = null, mapOpen = false;
function setPin(lat, lng) {
  here = { lat, lng };
  if (pin) pin.setLatLng([lat, lng]); else pin = L.marker([lat, lng]).addTo(map);
  document.getElementById("picked").textContent = `指定: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  refreshGo();
  ev("pin", { lat:+lat.toFixed(4), lng:+lng.toFixed(4) }); // 元に戻す（再表示）で、同じ場所にピンを置けるように
}
map.on("click", e => { if (mapOpen) setPin(e.latlng.lat, e.latlng.lng); });
const goBtn = document.getElementById("go"), areaInp = document.getElementById("area");
const refreshGo = () => lamp(goBtn, !!here && Number(areaInp.value) >= 10);
areaInp.addEventListener("input", refreshGo);
document.getElementById("preset").onclick = () => {
  if (!PLACE) { prefInp.value = "岐阜県"; cityInp.value = "岐阜市"; refreshOpen(); PLACE = "岐阜県岐阜市"; mapOpen = true; document.getElementById("step1").classList.remove("hidden"); } // 地図を開かずに例のピンを使った場合
  map.setView([35.4482, 136.7352], 16); setPin(35.4482, 136.7352);
};

// ---- 0. 都道府県・市区町村 → 地図を開く（国土地理院の住所検索で中心を出す） ----
map.setView([36.2, 137.5], 5); // 開く前は日本全体
let PLACE = ""; // 都道府県・市区町村は空白で始める（日本地図から）
// ---- ボタンの点灯／グレー：受け付けられる入力があれば点灯、未入力ならグレー ----
const lamp = (btn, ok) => { btn.classList.toggle("off", !ok); btn.setAttribute("aria-disabled", ok ? "false" : "true"); };
const prefInp = document.getElementById("prefName"), cityInp = document.getElementById("cityName"), openBtn = document.getElementById("openMap");
const refreshOpen = () => lamp(openBtn, !!prefInp.value.trim() && !!cityInp.value.trim());
[prefInp, cityInp].forEach(i => i.addEventListener("input", refreshOpen)); refreshOpen();
document.getElementById("openMap").onclick = async () => {
  const pref = document.getElementById("prefName").value.trim(), city = document.getElementById("cityName").value.trim();
  const msg = document.getElementById("mapMsg");
  if (!pref || !city) { msg.textContent = "都道府県と市区町村を入れてください。"; return; }
  msg.textContent = "地図を探しています…";
  let at = null;
  try {
    const r = await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(pref + city));
    const j = await r.json();
    if (j.length) at = j[0].geometry.coordinates; // [経度, 緯度]
  } catch (e) {}
  if (!at && pref + city === "岐阜県岐阜市") at = [136.7606, 35.4233];
  if (!at) { msg.textContent = `「${pref}${city}」が見つかりませんでした。表記を確かめてください。`; return; }
  PLACE = pref + city; mapOpen = true; ev("map", { place:PLACE });
  map.setView([at[1], at[0]], 14);
  msg.textContent = PLACE + "の地図を開きました。" + (PLACE === "岐阜県岐阜市" ? "" : "（仮データは岐阜市の分しかありません）");
  document.getElementById("step1").classList.remove("hidden");
};

// ---- 会話の状態とデータシート ----
let S = null;
const R = document.getElementById("result");
const yen = n => Math.round(n).toLocaleString() + "円";

document.getElementById("go").onclick = () => {
  if (!here || !(Number(document.getElementById("area").value) >= 10)) return; // ピンと面積がそろっていなければ何もしない
  // 進めた体験のあとに「評価する」を押し直したら、新しい体験として分ける（前の体験の保存内容を上書きしない）。巻き戻し・元に戻すの再現中は分けない
  if (!REPLAYING && typeof S !== "undefined" && S && (PATH.length || (S.api || []).length)) SID = newSid();
  PATH.length = 0; AI_HIST.length = 0; renderRoute();
  const area = Number(document.getElementById("area").value) || 0;
  const near = POINTS.map(p => ({ ...p, d: distM(here, p) })).sort((a, b) => a.d - b.d)[0];
  ev("evaluate", { near:near.name, area, place:PLACE });
  S = {
    // 層1: 入力で埋まる / 層2: データで埋まる / 層3: 対話で埋まる
    sheet: {
      市区町村: PLACE, 所在: `${here.lat.toFixed(4)}, ${here.lng.toFixed(4)}`, 面積: area + "㎡",
      最寄り標準地: `${near.name}（約${Math.round(near.d)}m）`, 標準地価格: yen(near.price) + "/㎡（仮）",
      用途地域: near.zone + "（仮）",
      形と向き: null, 接道: null, 持ち主の意向: null, 事情: null, 事情の要点: null
    },
    near, area, log: [], signals: [], revised: null, used: []
  };
  R.innerHTML = `
    <h2>2. データ（公開データから機械的に）</h2>
    <table class="data">
      <tr><td>最寄りの標準地</td><td>${near.name}（約${Math.round(near.d)}m）</td></tr>
      <tr><td>標準地価格</td><td>${yen(near.price)}/㎡（仮）</td></tr>
      <tr><td>用途地域</td><td>${near.zone}（仮）</td></tr>
      <tr><td>面積</td><td>${area}㎡</td></tr>
      <tr><td>単純計算の目安</td><td>${yen(near.price * area)}（標準地価格×面積）</td></tr>
    </table>
    <h2>3. AI</h2>
    <div id="talk"></div>
    <div id="inq"></div>`;
  firstJudgment();
};

// ---- 台本（本番ではアプリが組み立てたプロンプトをAIへ送る部分） ----
// 一投目の型（11-04 合意）：根拠のある決まりを一つ渡し、地図では読めない一点を正直に開ける。
// 開けた穴は、客だけが知っていることで即答できる。店の得意はまだ出さない（目的を透けさせない）。
// 各応答の「渡したもの／開けた穴」は設計メモで見える。
const SETBACK = { "鷺山":"この辺りは2005〜09年に、市が狭い道の解消を進めた地区です（岐阜市「鷺山地区 事後評価」）。ただ、全部の道が広がったわけではありません。" };

function firstJudgment() {
  saveSession();
  say("この土地に家を建て直せるかどうかは、値段より先に、一つの決まりで決まります。<br>"
    + "<b>幅4m以上の道に、2m以上接していること</b>（建築基準法の接道義務）。<br>"
    + "これは地図からは読めません。この土地は、道にどう接していますか？",
    "渡したもの：住む・活かす・手放す、どの道にも効く決まり（根拠つき）", "開けた穴：道への接し方（持ち主なら見れば分かる）");
  choices(["道に広く面している", "細い通路の奥にある（旗竿地）", "わからない"], onRoad, null, 1);
}
function onRoad(c) {
  if (c.startsWith("細い")) {
    S.sheet.形と向き = "旗竿地・奥まっています";
    say("旗竿地なら、決め手は<b>通路の幅</b>です。2mあれば建て直せます。2mに足りなければ、今の家はそのまま使えても、建て直しができない土地（再建築不可）として見られます。<br>通路の幅は、2mありますか？",
      "渡したもの：2mが何を決めるか（客は幅を知っていても、意味は知らないことが多い）", "開けた穴：通路の幅");
    choices(["2mある", "2mない・狭い", "測ったことがない"], onWidth, null, 2);
  } else if (c.startsWith("道に")) {
    S.sheet.形と向き = "道に面している";
    S.sheet.接道 = "道に広く面している（客の申告）";
    const local = SETBACK[S.near.name];
    say("それなら、接する長さは心配いりません。残るのは<b>前の道の幅</b>です。4mに足りない道だと、建て直すときに敷地を道側へ下げる（セットバック）ことになり、使える面積が減ります。"
      + (local ? "<br>" + local : "") + "<br>前の道は、車同士がすれ違えますか？",
      "渡したもの：道の幅が面積を削る決まり" + (local ? "＋地域の事実（年次・出典つき）" : ""), "開けた穴：前の道の幅（すれ違えるか、で答えられる）");
    choices(["すれ違える", "すれ違えない", "わからない"], c2 => {
      S.sheet.接道 += { "すれ違える":"／前の道は広い", "すれ違えない":"／前の道は4m未満の可能性（セットバック）", "わからない":"／前の道の幅は不明" }[c2];
      if (c2 === "わからない") S.signals.push("前の道の幅：客は分からない（現地確認）");
      askBuilding(c2 === "すれ違えない" ? "それなら、建て直すときに何㎡残るかを先に確かめる土地です。" : "接道の面では、この土地は素直な土地です。");
    }, null, 2);
  } else {
    S.signals.push("接し方：客は分からない（現地確認）");
    askBuilding("わからなくて当然です。普段、気にする所ではありません。担当が現地を一度見れば、すぐ分かる所です。");
  }
}
function onWidth(c) {
  if (c === "2mある") {
    S.sheet.接道 = "旗竿地・通路2m以上（客の申告）";
    askBuilding("それなら建て直せます。旗竿地でも、ここが通っていれば土台は崩れません。");
  } else if (c === "2mない・狭い") {
    S.sheet.接道 = "旗竿地・通路2m未満（客の申告）＝再建築不可の可能性";
    const k = PREF.localKnowledge[S.near.name];
    askBuilding("それなら、この土地の値打ちは「単独で何ができるか」より、「お隣と合わせたら何ができるか」で決まります。"
      + (k && k.includes("隣地") ? `<br><small>（${PREF.office}の土地勘：${k}）</small>` : ""));
  } else {
    S.sheet.接道 = "旗竿地・通路の幅は不明";
    S.signals.push("通路の幅：客は測ったことがない（現地確認）");
    askBuilding("測ったことがない方がほとんどです。メジャー一本で分かりますし、担当が見に行くこともできます。");
  }
}
function askBuilding(lead) {
  say(lead + "<br>もう一つだけ。今、この土地に建物はありますか？",
    "渡したもの：接道の答えが、この土地にとって何を意味するか", "開けた穴：建物の有無（建て直しが今の話か、先の話かが分かれる）");
  choices(["住んでいる家がある", "空き家・古い家がある", "何もない（更地）"], onIntent, null, 3);
}
function onIntent(c) {
  S.sheet.持ち主の意向 = c;
  const s = c.startsWith("住んで") ? "住んでいるなら、建て直しは先の話です。ただ、いつか誰かに渡すときには、今日の接道の話がそのまま値打ちになります。"
    : c.startsWith("空き家") ? "空き家が残っているなら、建て直せるかどうかが、そのまま「解体して売るか」「そのまま貸すか」の分かれ目になります。"
    : "更地なら、接道の答えがそのまま、この土地で何ができるかです。";
  BRANCH = null;
  inquiryBar(); // 問い合わせのボタンは④から出す
  goStep(0, s);
}
// ---- ④から先：管理画面（admin_mode.html）で店が書いた選択肢で進む ----
// 管理画面で「設定確定」した設定はブラウザに保存され、ここで読む。なければ総合系の初期値。

    inp.addEventListener("input", refreshSend); d.addEventListener("click", () => setTimeout(refreshSend, 0)); refreshSend();
    b.onclick = () => {
      if (d.dataset.step) return;
      const t = d.querySelector("input.other").value.trim(), sel = d.querySelector("button.sel");
      if (!t && !sel) return;
      if (sel) { sel.classList.remove("sel"); pick(sel, sel.dataset.c, +sel.dataset.opt, t); b.classList.add("chosen"); }
      else pick(b, "送信", 0, t);
      me(sel ? sel.dataset.c + (t ? "／" + t : "") : t); onText(t, sel ? sel.dataset.c : null);
    };
  }
  document.getElementById("talk").appendChild(d);
}

// ---- 通った道（データの経路）と巻き戻し ----
const PATH = [];
const NUM = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
// 問いごとの行。番号（①②③）は会話の中の何番目の問いか。「②の3を押すと」と言えるように常に出す。
function newRow(q) {
  const d = document.createElement("div"); d.className = "row";
  const prev = [...document.querySelectorAll("#talk .row")].pop();
  d.dataset.q = q || (prev ? +prev.dataset.q + 1 : 1);
  d.innerHTML = `<span class="qnum">${NUM[d.dataset.q - 1]}</span>`;
  return d;
}
function renderRoute() {
  const r = document.getElementById("route");
  r.innerHTML = PATH.length ? "<b>通った道</b>　" + PATH.map(p => NUM[p.q - 1] + (p.opt ? `の${p.opt} ${p.press}${p.type ? "：" + esc(p.type) : ""}` : `「${esc(p.type)}」`)).join(" → ")
    + '<div class="hint">薄いボタンを押すと、その場所から別の道を試せます。</div>' : "";
  saveSession();
}
function rewind(k, c) {
  ev("rewind", { k });
  document.querySelectorAll(".demo, .demo-badge").forEach(x => x.remove());
  replay(PATH.slice(0, k).concat({ press:c }));
}
function replay(steps) {
  REPLAYING = true;
  document.getElementById("go").click();
  for (const st of steps) {
    const row = [...document.querySelectorAll("#talk .row:not(.done)")].pop();
    if (!row) break;
    const ta = row.querySelector("textarea");
    if (st.type && ta) { ta.value = st.type; row.querySelector("button").click(); continue; }
    if (st.type) row.querySelector("input.other").value = st.type;
    let b = [...row.querySelectorAll("button")].find(x => x.dataset.c === st.press);
    if (!b && st.type) b = row.querySelector('button[data-c="送信"]'); // 当時あったボタン（例：廃止した仮のAI候補）が今はないときは、書いた言葉だけを送信して続ける
    if (!b) break; b.click();
    const send = row.querySelector('button[data-c="送信"]');
    if (send && b !== send && !row.classList.contains("done")) { row.querySelector("input.other").value = st.type || ""; send.click(); }
  }
  REPLAYING = false;
  const last = [...document.querySelectorAll("#talk .row:not(.done)")].pop();
  (last || document.getElementById("talk").lastElementChild).scrollIntoView({ block:"center" });
}

// ---- デモ再生（?demo=名前）：シミュレーションの記録を、実物のボタンに①②③を付けて見せる ----
// 記録は「押すボタンの名前（実際の表記のまま）＋その場のひと言」だけ。文章のレポートの代わりに使う。
const DEMOS = {
  sagiyama: {
    title: "鷺山の旗竿地・空き家（一投目＝接道）",
    steps: [
      { press:"地図を開く", fill:{ prefName:"岐阜県", cityName:"岐阜市" }, note:"最初は都道府県と市区町村を入れる（空白から始まる）。デモでは岐阜県岐阜市。" },
      { press:"例：鷺山の旗竿地にピンを置く", note:"本番は地図をクリック。デモでは例の場所に置きます。" },
      { press:"評価する", note:"公開データが機械的に出て、①が始まる。" },
      { press:"細い通路の奥にある（旗竿地）", note:"一投目は値段でも店でもなく、接道の決まり。客は見れば答えられる。" },
      { press:"2mない・狭い", note:"ここで初めて店の土地勘（隣と合わせる）が出る。客の答えが呼び出したので、売り込みに見えない。" },
      { press:"空き家・古い家がある", note:"建物の有無で、接道の話が客の今に戻る。" },
      { press:"建てずに貸す（駐車場など）", note:"ここまでがロケーション。④から先は、店が管理画面に書いた選択肢（番号も管理画面と同じ）。選ぶ代わりに、下の欄に書いて送信してもよい。" },
      { press:"かかる費用の目安", note:"⑤。この先にボタンが書かれていなければ、AIは打ち切りの文で終わる。" },
      { press:"これらの情報をもとにお問い合わせ", note:"問い合わせは最初からずっと下にある。人と話したくなった時が問い合わせの時。" },
      { fill:{ fName:"岐阜 太郎", fTel:"058-000-0000", fWhen:"平日の夕方" }, press:"この内容で送る", note:"相談の記録は画面に出さず、送るときに店へ添える。" },
    ]
  }
};
const DEMO = DEMOS[new URLSearchParams(location.search).get("demo")];
if (DEMO) {
  let i = 0;
  const panel = document.createElement("div"); panel.className = "demo";
  document.body.appendChild(panel);
  const mark = () => {
    if (!panel.isConnected) return; // 別の道を試すとデモは終わる
    document.querySelectorAll(".demo-next").forEach(b => b.classList.remove("demo-next"));
    const st = DEMO.steps[i];
    if (!st) { panel.innerHTML = `<b>${DEMO.title}</b><br>デモはここまで。`; return; }
    const live = [...document.querySelectorAll("#talk .row:not(.done) button, #step0 button, #step1:not(.hidden) button, #inq button")];
    const btn = live.find(b => (b.dataset.c || b.textContent) === st.press);
    const row = btn && btn.closest(".row");
    const where = row ? NUM[row.dataset.q - 1] + (btn.dataset.opt ? "の" + btn.dataset.opt : "") : "";
    panel.innerHTML = `<b>${DEMO.title}</b>　手順 ${i + 1} / ${DEMO.steps.length}<br>${where}「${st.press}」を押す<br><span>${st.note}</span>`;
    if (!btn) return setTimeout(mark, 400); // 地図を開く（住所検索）のように、次のボタンが遅れて出る場合
    if (st.type) row.querySelector("textarea").value = st.type;
    if (st.fill) Object.entries(st.fill).forEach(([id, v]) => { const el = document.getElementById(id); el.value = v; el.dispatchEvent(new Event("input", { bubbles:true })); });
    btn.classList.add("demo-next"); // 赤枠で次に押すボタンを示す
    btn.scrollIntoView({ block:"center", behavior:"smooth" });
    btn.addEventListener("click", () => { i++; setTimeout(mark, 0); }, { once:true });
  };
  mark();
}

// ---- 元に戻す（再表示）：開発利用状況から、保存されたセッションの状態へ、この画面を戻す ----
// 地図・ピン・①〜⑦の選択を順に再現し、AIの返事は記録にある本物の文を使う（Claude は呼ばない）。戻したあとの操作は、新しい体験として記録される。
function pinFrom(d) {
  const m = String(((d.state || {}).sheet || {}).所在 || "").match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if (m) return { lat:+m[1], lng:+m[2] };
  const PRE = { lat:35.4482, lng:136.7352 }, p = d.pin; // 古い記録は、小数2桁に丸めた位置だけ。例のピン付近なら、例のピンとみなす
  if (p && Math.abs(p.lat - PRE.lat) < 0.01 && Math.abs(p.lng - PRE.lng) < 0.01) return PRE;
  return p || PRE;
}
// 安全な描き直し：保存された文字列は信用しない。決まった種類の要素（b・br・small・i・em・strong・span）だけを、属性なしで作り直す
const SAFE_TAGS = new Set(["B", "BR", "SMALL", "I", "EM", "STRONG", "SPAN"]);
function safeFragment(html) {
  const doc = new DOMParser().parseFromString("<body>" + String(html || "") + "</body>", "text/html");
  const out = document.createDocumentFragment();
  const walk = (src, dst) => {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.nodeValue));
      else if (n.nodeType === 1 && SAFE_TAGS.has(n.tagName)) {
        const el = document.createElement(n.tagName.toLowerCase());
        if (n.tagName === "SPAN" && /^[\w -]{1,30}$/.test(n.getAttribute("class") || "")) el.className = n.getAttribute("class"); // class だけ許す（hint など）
        walk(n, el); dst.appendChild(el);
      } else if (n.nodeType === 1) walk(n, dst); // 許さない要素は、中身の文字だけ残す
    }
  };
  walk(doc.body, out);
  return out;
}
function restoreFromSnapshot(d) {
  const st = d.state || {}, sn = d.snapshot, sh = st.sheet || {};
  REPLAYING = true;
  try {
    SID = newSid(); window.__restored = true;
    mapOpen = true; document.getElementById("step1").classList.remove("hidden");
    if (sn.place) PLACE = sn.place;
    document.getElementById("area").value = sn.area || 120;
    map.setView([sn.pin.lat, sn.pin.lng], 16); setPin(sn.pin.lat, sn.pin.lng);
    // 状態：保存された記録から作り直す（店の設定には頼らない）
    const near = POINTS.find(p => p.name === sn.near) || POINTS[3];
    PATH.length = 0; for (const p of st.path || []) PATH.push({ press:p.press, q:p.q, ...(p.opt ? { opt:p.opt } : {}), ...(p.type ? { type:p.type } : {}) });
    AI_HIST.length = 0;
    const oks = (d.turns || []).filter(t => t.status === "ok" && t.reply);
    for (const t of oks) AI_HIST.push({ role:"user", content:t.user || "" }, { role:"assistant", content:t.reply });
    const sheet = {}; for (const [k, v] of Object.entries(sh)) sheet[k] = v == null || v === "" ? null : esc(String(v));
    S = { sheet, near, area:sn.area || 120, log:[], signals:(st.signals || []).slice(), revised:st.revised || null, used:[],
      api: oks.map((t, i) => ({ step:i + 1, usage:{ input:t.inTok || 0, output:t.outTok || 0 }, costUsd:t.costUsd || 0, ms:t.ms || 0 })) };
    const p4 = PATH.find(x => x.q === 4);
    if (p4 && ADMIN.steps[1] && ADMIN.steps[1].branches) { const s4 = ADMIN.steps[0], j = s4.btns.findIndex(b => b.trim() === p4.press); BRANCH = ADMIN.steps[1].branches[j >= 0 ? s4.br[j] : 0] || null; }
    renderRoute();
    // 画面：データの表と会話欄を、保存された中身から作り直す
    R.innerHTML = `
      <h2>2. データ（公開データから機械的に）</h2>
      <table class="data">
        <tr><td>最寄りの標準地</td><td>${esc(String(sh.最寄り標準地 || near.name))}</td></tr>
        <tr><td>標準地価格</td><td>${esc(String(sh.標準地価格 || yen(near.price) + "/㎡（仮）"))}</td></tr>
        <tr><td>用途地域</td><td>${esc(String(sh.用途地域 || near.zone + "（仮）"))}</td></tr>
        <tr><td>面積</td><td>${esc(String(sh.面積 || (sn.area || 120) + "㎡"))}</td></tr>
      </table>
      <h2>3. AI</h2>
      <div id="talk"></div>
      <div id="inq"></div>`;
    const talk = document.getElementById("talk");
    for (const it of sn.talk) {
      if (it.t === "ai") {
        const el = document.createElement("div"); el.className = "ai";
        const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "AI"; el.appendChild(tag);
        el.appendChild(safeFragment(it.html));
        if (it.will) { const w = document.createElement("div"); w.className = "will"; w.appendChild(safeFragment(it.will)); el.appendChild(w); }
        talk.appendChild(el);
      } else if (it.t === "me") {
        const el = document.createElement("div"); el.className = "me"; const sp = document.createElement("span"); sp.textContent = it.text; el.appendChild(sp); talk.appendChild(el);
      } else if (it.t === "row" && it.done) { // まだ答えていなかった最後の行は、戻した画面では操作できないので出さない
        const el = document.createElement("div"); el.className = "row done restored"; el.dataset.q = it.q; if (it.step !== null) el.dataset.step = it.step;
        const q = document.createElement("span"); q.className = "qnum"; q.textContent = NUM[it.q - 1] || it.q; el.appendChild(q);
        let line = null;
        for (const b of it.buttons) {
          const btn = document.createElement("button"); btn.dataset.c = b.c; if (b.opt) { btn.dataset.opt = b.opt; const o = document.createElement("span"); o.className = "opt"; o.textContent = b.opt; btn.appendChild(o); }
          btn.append(b.c); if (b.chosen) btn.classList.add("chosen"); else btn.title = "ここから別の道を試す";
          if (b.c === "送信" && it.hasText) { if (!line) { line = document.createElement("div"); line.className = "textline"; el.appendChild(line); } line.appendChild(btn); } else el.appendChild(btn);
        }
        talk.appendChild(el);
      }
    }
    if (p4) inquiryBar();
  } finally { REPLAYING = false; }
  talk_banner(d, true);
  saveSession();
}
// 戻した画面の、選ばなかったボタンを押すと、その場所から別の道を試せる（既存の巻き戻しをそのまま使う）
R.addEventListener("click", e => {
  const b = e.target.closest(".row.restored button"); if (!b || b.classList.contains("chosen")) return;
  const row = b.closest(".row"); if (row.dataset.step === undefined) return;
  rewind(+row.dataset.step, b.dataset.c);
});
function talk_banner(d, fromSnapshot) {
  const talk = document.getElementById("talk");
  if (talk) talk.insertAdjacentHTML("afterbegin", `<div class="hint" style="background:#fff7e6;border:1px solid #f5d28a;border-radius:6px;padding:6px 10px;margin:6px 0">元に戻した体験：セッション ${esc(String(d.sid).slice(0, 8))}（${esc(new Date(d.savedAt).toLocaleString("ja-JP"))}）。${fromSnapshot ? "保存された画面をそのまま戻しています。" : "操作を再現し直して戻しています。"}ここから操作を続けるには、薄いボタンを押して、その場所から別の道を試してください。${d.reconstructed ? "ログからの復元のため、一部は今の画面の値です。" : ""}</div>`);
}
function restoreSession(d) {
  if (d.snapshot && Array.isArray(d.snapshot.talk) && d.snapshot.talk.length && d.snapshot.pin) return restoreFromSnapshot(d); // スナップショットがあれば、再現し直さず、そのまま描き直す
  const st = d.state || {}, sh = st.sheet || {};
  REPLAYING = true;
  try {
    SID = newSid(); window.__restored = true;
    RESTORE = { replies: (d.turns || []).filter(t => t.status === "ok" && t.reply).map(t => ({ reply:t.reply, usage:{ input:t.inTok || 0, output:t.outTok || 0 }, costUsd:t.costUsd || 0, ms:t.ms || 0 })) };
    mapOpen = true; document.getElementById("step1").classList.remove("hidden");
    if (sh.市区町村) PLACE = sh.市区町村;
    const a = String(sh.面積 || "").match(/\d+/); if (a) document.getElementById("area").value = a[0];
    const p = pinFrom(d); map.setView([p.lat, p.lng], 16); setPin(p.lat, p.lng);
  } finally { REPLAYING = false; }
  replay((st.path || []).map(x => ({ press:x.press, type:x.type, q:x.q, opt:x.opt })));
  RESTORE = null;
  talk_banner(d, false);
  saveSession();
}
if ("BroadcastChannel" in window) {
  const userCh = new BroadcastChannel("reUser");
  userCh.onmessage = e => {
    if (!e.data || e.data.type !== "restore" || !e.data.data) return;
    try { restoreSession(e.data.data); userCh.postMessage({ type:"restored", sid:e.data.data.sid }); }
    catch (err) { REPLAYING = false; userCh.postMessage({ type:"restore-failed", sid:e.data.data.sid, message:String(err && err.message || err) }); }
  };
}
