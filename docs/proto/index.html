<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土地の見立て（試作）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#1f2933; --sub:#52606d; --line:#d9e2ec; --bg:#f7f9fb; --ai:#fffaf0; --ai-line:#f0c36d; --accent:#1d6fb8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .note { font-size:12px; color:#b4472b; }
  .wrap { display:grid; grid-template-columns: 1fr 440px; height:calc(100vh - 50px); }
  #map { height:100%; }
  aside { overflow-y:auto; padding:14px 16px 40px; background:#fff; border-left:1px solid var(--line); }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; height:auto; } #map{ height:45vh; } aside{ border-left:none; } }
  h2 { font-size:14px; margin:18px 0 8px; color:var(--sub); }
  label { font-size:13px; display:block; margin:6px 0 2px; }
  input[type=number], textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
  button { font-size:14px; padding:9px 12px; border-radius:6px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; margin:4px 4px 0 0; }
  button.primary { background:var(--accent); color:#fff; width:100%; margin-top:10px; }
  button:disabled { opacity:.4; cursor:default; }
  .data { width:100%; border-collapse:collapse; font-size:13px; }
  .data td { border-bottom:1px solid var(--line); padding:5px 4px; }
  .data td:first-child { color:var(--sub); width:42%; }
  .ai { background:var(--ai); border-left:4px solid var(--ai-line); padding:10px 12px; margin:10px 0 4px; font-size:15px; line-height:1.7; border-radius:4px; }
  .ai .tag { font-size:11px; color:#a0701a; display:block; margin-bottom:2px; }
  .me { text-align:right; margin:8px 0; font-size:14px; }
  .me span { background:#e6f0fa; padding:6px 10px; border-radius:12px; display:inline-block; }
  .hint { font-size:12px; color:var(--sub); }
  .sheet { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:13px; }
  .sheet h3 { font-size:13px; margin:8px 0 4px; }
  .empty { color:#b4472b; }
  details { font-size:12px; color:var(--sub); margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>土地の見立て ― 試作</h1>
  <span class="note">仮データ・AI未接続（台本で動作）。数値は実在しません。</span>
</header>
<div class="wrap">
  <div id="map"></div>
  <aside>
    <div id="step1">
      <h2>1. 地図をクリックして場所を指定</h2>
      <div id="picked" class="hint">まだ指定されていません（岐阜市内）</div>
      <label for="area">面積（㎡）</label>
      <input id="area" type="number" value="120" min="10">
      <button id="go" class="primary" disabled>評価する</button>
    </div>
    <div id="result"></div>
    <details>
      <summary>事業所設定（プレファレンス・仮）</summary>
      <pre id="prefView"></pre>
    </details>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- 仮データ（実在しない数値） ----
const POINTS = [
  { name:"岐阜駅前",  lat:35.4095, lng:136.7564, price:300000, zone:"商業地域" },
  { name:"柳ケ瀬",    lat:35.4237, lng:136.7608, price:180000, zone:"商業地域" },
  { name:"長良",      lat:35.4430, lng:136.7700, price:120000, zone:"第一種住居地域" },
  { name:"鷺山",      lat:35.4480, lng:136.7350, price:80000,  zone:"第一種低層住居専用地域" },
  { name:"茜部",      lat:35.3900, lng:136.7500, price:90000,  zone:"第一種住居地域" },
];
// 事業所の土地勘（プレファレンス）
const PREF = {
  office: "（仮）〇〇不動産",
  strengths: ["売買仲介", "隣地との一体活用の提案"],
  localKnowledge: {
    "長良": "川沿いは景観で指名買いがある。北側の駐車場は所有者が売却に前向き。",
    "鷺山": "旗竿地が多く相場より厳しく見られがち。隣地取得で化ける例を複数扱った。",
    "茜部": "幹線沿いは店舗需要あり。奥は住宅地として落ち着いている。",
    "柳ケ瀬": "空き店舗の転用相談が増えている。",
    "岐阜駅前": "狭小地でも収益物件の引き合いがある。"
  },
  tone: "踏み込むが嘘はつかない"
};
document.getElementById("prefView").textContent = JSON.stringify(PREF, null, 2);

function distM(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// ---- 地図 ----
const map = L.map("map").setView([35.423, 136.760], 13);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>', maxZoom: 18
}).addTo(map);
POINTS.forEach(p => L.circleMarker([p.lat, p.lng], { radius:6, color:"#888" }).addTo(map).bindTooltip("標準地(仮) " + p.name));
let pin = null, here = null;
map.on("click", e => {
  here = { lat: e.latlng.lat, lng: e.latlng.lng };
  if (pin) pin.setLatLng(e.latlng); else pin = L.marker(e.latlng).addTo(map);
  document.getElementById("picked").textContent = `指定: ${here.lat.toFixed(4)}, ${here.lng.toFixed(4)}`;
  document.getElementById("go").disabled = false;
});

// ---- 会話の状態とデータシート ----
let S = null;
const R = document.getElementById("result");
const yen = n => Math.round(n).toLocaleString() + "円";

document.getElementById("go").onclick = () => {
  const area = Number(document.getElementById("area").value) || 0;
  const near = POINTS.map(p => ({ ...p, d: distM(here, p) })).sort((a, b) => a.d - b.d)[0];
  S = {
    // 層1: 入力で埋まる / 層2: データで埋まる / 層3: 対話で埋まる
    sheet: {
      所在: `${here.lat.toFixed(4)}, ${here.lng.toFixed(4)}`, 面積: area + "㎡",
      最寄り標準地: `${near.name}（約${Math.round(near.d)}m）`, 標準地価格: yen(near.price) + "/㎡（仮）",
      用途地域: near.zone + "（仮）",
      形と向き: null, 持ち主の意向: null, 事情: null, 事情の要点: null
    },
    near, area, log: [], signals: [], revised: null
  };
  R.innerHTML = `
    <h2>2. データ（公開データから機械的に）</h2>
    <table class="data">
      <tr><td>最寄りの標準地</td><td>${near.name}（約${Math.round(near.d)}m）</td></tr>
      <tr><td>標準地価格</td><td>${yen(near.price)}/㎡（仮）</td></tr>
      <tr><td>用途地域</td><td>${near.zone}（仮）</td></tr>
      <tr><td>面積</td><td>${area}㎡</td></tr>
      <tr><td>単純計算の目安</td><td>${yen(near.price * area)}（標準地価格×面積）</td></tr>
    </table>
    <h2>3. AI判定</h2>
    <div id="talk"></div>`;
  say(firstJudgment());
  choices(["角地・南向きです", "旗竿地・奥まっています", "よくわからない"], onShape);
};

// ---- 台本（本番ではアプリが組み立てたプロンプトをAIへ送る部分） ----
function firstJudgment() {
  const { near, area } = S;
  const far = near.d > 400, small = area < 100, large = area > 300;
  let s = "";
  if (far) s += `標準地から約${Math.round(near.d)}m離れています。上の目安額は、そのまま当てはまらない可能性が高いです。`;
  else s += `標準地には近い場所です。ただ、上の目安額はあくまで標準的な形の土地の話です。`;
  if (small) s += "この広さだと建てられるものが限られ、順当な評価では期待しにくい土地です。";
  else if (large) s += "この広さは一般の住宅向けには大きすぎて、相場どおりには評価されにくい面があります。";
  else s += "形と向き次第で、目安より大きく下がることもあります。";
  return s + "<br>まず、土地の形と向きを教えてください。見方が変わります。";
}
function onShape(c) {
  S.sheet.形と向き = c;
  const k = PREF.localKnowledge[S.near.name];
  let s;
  if (c.startsWith("旗竿")) s = "正直に言えば、売るだけなら目安額よりかなり厳しく見られます。";
  else if (c.startsWith("角地")) s = "角地で南向きなら、目安額より上を狙える条件がそろっています。";
  else s = "わからなくても大丈夫です。形と向きは、現地を見れば私たちがお調べできます。";
  if (k) s += `<br>ただ、この辺りでは「${k}」という事情があります。見方次第で、弱みが強みに変わる土地です。`;
  say(s + "<br>この土地は、どうしたいとお考えですか？");
  choices(["活かす道を知りたい", "手放すことも考えている", "そう言える根拠を詳しく"], onIntent);
}
function onIntent(c) {
  S.sheet.持ち主の意向 = c;
  let s;
  if (c.startsWith("活かす")) s = "活かし方は、売る・貸す・隣と合わせる・建て替える、で大きく変わります。";
  else if (c.startsWith("手放す")) s = "手放すにしても、今すぐ売るのが一番とは限りません。順番を変えるだけで手元に残る額が変わることがあります。";
  else s = `根拠は上のデータです。標準地（${S.near.name}）との距離と、面積・形の違いが主な理由です。数字はすべて上の表から出しています。`;
  say(s + "<br>差し支えなければ、この土地について気になっていることを、ひと言で聞かせてください。");
  freeInput(1);
}
function freeInput(turn) {
  const box = document.createElement("div");
  box.innerHTML = `<textarea rows="2" placeholder="例：親から相続したが、固定資産税が負担で…"></textarea>
    <button>送る</button><div class="hint">（後半の対話。本番ではAIがその場で答えます）</div>`;
  document.getElementById("talk").appendChild(box);
  box.querySelector("button").onclick = () => {
    const t = box.querySelector("textarea").value.trim(); if (!t) return;
    box.remove(); me(t);
    S.sheet.事情 = (S.sheet.事情 ? S.sheet.事情 + " / " : "") + esc(t);
    if (turn === 1) {
      secondWord(t);
    } else {
      say("わかりました。ここまでの内容を整理しました。電話では、この続きからお話しできます。");
      showSheet();
    }
  };
}
// ---- 二言目：客の言葉を読み、最初の見立てのどこが変わるかを言う ----
// 本番ではAIが行う。ここではアプリがAIに託す判断ルールの見本として書く：
//   (1) 客の言葉から手がかりを拾う (2) 最初の見立てのどの部分が変わるかを名指しする
//   (3) 形・土地勘と掛け合わせて具体の道を出す (4) 拾えなければ、拾えなかったと言う
const CUES = [
  { key:"負担", re:/固定資産税|税金|税が|維持費|管理|草刈|草が|負担/,
    revise:"最初に「順当な評価では期待しにくい」と言いましたが、あれは売値の話でした。悩みが負担なら、問うべきは売値ではなく「毎年出ていくお金をどう止めるか」です。",
    path:"貸して税と管理費を賄う（月極駐車場・資材置き場など）か、早く引き取ってくれる相手を探すか" },
  { key:"相続", re:/相続|親から|実家|亡くな|遺産|名義/,
    revise:"相続した土地なら、売るか持つかの前に「名義が誰になっているか」で選べる道が変わります。値段の話はその後です。",
    path:"名義が整っていれば売るのも貸すのもすぐ動ける。まだなら名義の整理が最初の一歩" },
  { key:"家族", re:/兄弟|姉妹|共有|家族|親族|妻|夫|子ども|息子|娘/,
    revise:"ご家族が関わるなら、一番の壁は土地の条件ではなく、皆さんの考えを揃えることかもしれません。",
    path:"売った場合・貸した場合・持ち続けた場合の数字を並べて、家族で同じ紙を見る" },
  { key:"建物", re:/空き家|古家|古い家|建物|解体|家が建/,
    revise:"建物が残っているなら、最初の目安額（更地の計算）はそのまま使えません。解体費を誰が持つかで手取りが変わります。",
    path:"古家付きのまま売る場合と、解体してから売る場合の手取りを比べる" },
  { key:"隣", re:/隣|となり|お隣/,
    revise:"お隣の話が出たのは大きいです。この土地の値打ちは、単独の売値と、お隣にとっての値打ちが別物です。",
    path:"お隣に一体利用を打診する" },
  { key:"急ぎ", re:/急|すぐ|早く|期限|年内|今年/,
    revise:"急ぐなら、最初に言った「目安より下がる」幅は、さらに広がる覚悟が要ります。逆に半年待てるなら、選べる相手が増えます。",
    path:"期限から逆算して、買い取り（早い・安い）と仲介（遅い・高い）のどちらにするか決める" },
  { key:"使う", re:/住み|建て|自分で|使い|戻/,
    revise:"ご自分で使うお考えなら、最初の「評価されにくい」は関係ありません。売値ではなく、何が建てられるかが問いです。",
    path:"用途地域と形から、建てられるものを先に確かめる" },
];

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function secondWord(t) {
  t = esc(t);
  const hits = CUES.filter(c => c.re.test(t));
  if (!hits.length) {
    S.signals.push(`読み取れなかった言葉：「${t}」`);
    say("正直に言います。今のお話から、最初の見立てを直す手がかりを私は読み取れませんでした。決めつけずに伺います。どれに近いですか？");
    choices(["お金の負担の話", "家族・相続の話", "使い道の話", "うまく言葉にできない"], c => {
      if (c === "うまく言葉にできない") { S.signals.push("「うまく言葉にできない」が押された"); return askHurry("それで大丈夫です。言葉にしにくいことほど、電話で一緒に整理する価値があります。"); }
      const map = { "お金の負担の話":"負担", "家族・相続の話":"相続", "使い道の話":"使う" };
      respond([CUES.find(x => x.key === map[c])], c);
    });
    return;
  }
  respond(hits, t);
}

function respond(hits, quote) {
  const main = hits[0], k = PREF.localKnowledge[S.near.name], shape = S.sheet.形と向き || "";
  let s = `「${quote}」と伺って、見立てを一つ直します。<br>${main.revise}`;
  const paths = hits.map(h => h.path);
  if (shape.startsWith("旗竿") && !hits.some(h => h.key === "隣"))
    paths.push("旗竿地は、お隣と合わせた瞬間に普通の土地になります。お隣への打診も道の一つ");
  if (shape.startsWith("角地")) paths.push("角地は単独でも強いので、値を下げて急ぐ理由は薄い");
  s += "<br>考えられる道：<br>・" + paths.join("<br>・");
  if (k) s += `<br><small>（根拠：${PREF.office}の土地勘「${k}」）</small>`;
  S.revised = main.revise;
  S.sheet.事情の要点 = hits.map(h => h.key).join("・");
  say(s);
  choices(["違う", "合っている、続けて", "うまく言葉にできない"], c => {
    if (c === "違う") { S.signals.push(`見立てを外した（手がかり「${main.key}」と読んだ）`); say("外しました。すみません。どこが違うか、ひと言で聞かせてください。"); return freeInput(1); }
    if (c === "うまく言葉にできない") S.signals.push("二言目のあとで「うまく言葉にできない」が押された");
    askHurry(c === "合っている、続けて" ? "ありがとうございます。" : "それで大丈夫です。");
  });
}

function askHurry(lead) {
  say(lead + "<br>最後にもう一つ。いつ頃までに決めたい、というのはありますか？");
  freeInput(2);
}

function showSheet() {
  const rows = Object.entries(S.sheet).map(([k, v]) =>
    `<tr><td>${k}</td><td>${v ?? '<span class="empty">未取得（現地確認へ）</span>'}</td></tr>`).join("");
  const div = document.createElement("div");
  div.innerHTML = `<h2>4. データシート（対話の結果として）</h2><table class="data">${rows}</table>
    <h2>5. 要所レポート（業者向け）</h2>
    <div class="sheet">
      <h3>電話の入口になる一言</h3>
      「先日の見立ての続きです。${S.sheet.形と向き}という条件と、${S.sheet.持ち主の意向}というお考えから、売る以外の道も具体的にお持ちしました。」
      <h3>押さえるべき点</h3>
      ・客が自分の言葉で語ったこと：「${S.sheet.事情}」<br>
      ・土地勘（${S.near.name}）：${PREF.localKnowledge[S.near.name] || "（登録なし）"}<br>
      ・AIが途中で見立てを直した点：${S.revised || "（直していない）"}
      <h3>AIの浅さの記録（会話が詰まった所）</h3>
      ${S.signals.length ? "・" + S.signals.join("<br>・") : "（なし）"}
    </div>`;
  document.getElementById("talk").appendChild(div);
}
// ---- 表示部品 ----
function say(html) { const d = document.createElement("div"); d.className = "ai"; d.innerHTML = `<span class="tag">AI判定</span>${html}`; document.getElementById("talk").appendChild(d); }
function me(t) { const d = document.createElement("div"); d.className = "me"; d.innerHTML = "<span></span>"; d.firstChild.textContent = t; document.getElementById("talk").appendChild(d); }
function choices(list, cb) {
  const d = document.createElement("div");
  list.forEach(c => { const b = document.createElement("button"); b.textContent = c;
    b.onclick = () => { d.remove(); me(c); cb(c); }; d.appendChild(b); });
  document.getElementById("talk").appendChild(d);
}
</script>
</body>
</html>
