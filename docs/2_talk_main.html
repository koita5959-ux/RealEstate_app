<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土地の相談（対話型・試作）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#1f2933; --sub:#52606d; --line:#d9e2ec; --bg:#f7f9fb; --ai:#fffaf0; --ai-line:#f0c36d; --accent:#1d6fb8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); }
  body { display:flex; flex-direction:column; height:100vh; }
  .wrap { display:grid; grid-template-columns: 1fr 440px; flex:1; min-height:0; }
  #map { height:100%; }
  #map.aim, #map.aim.leaflet-grab { cursor:crosshair; } /* 地図を開いた後、マウスが0.5秒止まったら十字（ここにピンを置ける）。動かす・ドラッグで掌に戻る */
  aside { overflow-y:auto; padding:14px 16px 40px; background:#fff; border-left:1px solid var(--line); }
  @media (max-width:820px){ body{ display:block; height:auto; } .wrap{ grid-template-columns:1fr; height:auto; } #map{ height:45vh; } aside{ border-left:none; } }
  h2 { font-size:14px; margin:18px 0 8px; color:var(--sub); }
  label { font-size:13px; display:block; margin:6px 0 2px; }
  input[type=number], textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
  button { font-size:14px; padding:9px 12px; border-radius:6px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; margin:4px 4px 0 0; }
  button.primary { background:var(--accent); color:#fff; width:100%; margin-top:10px; }
  button:disabled { opacity:.4; cursor:default; }
  .pc-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px; }
  .pc label { display:block; margin:0 0 2px; }
  .pc input[type=text] { margin-bottom:0; }
  .combo { position:relative; }
  .combo-list { position:absolute; left:0; right:0; top:100%; z-index:1200; max-height:260px; overflow-y:auto; margin:2px 0 0; padding:3px 0; list-style:none; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.18); }
  .combo-list li { padding:7px 10px; font-size:14px; cursor:pointer; }
  .combo-list li.on, .combo-list li:hover { background:#eef4fb; }
  .combo-list li.none { color:var(--sub); cursor:default; font-size:13px; }
  body.ai-wait #talk .row.done button:not(.chosen) { background:#c3c9d0 !important; color:#fff !important; border-color:#c3c9d0 !important; cursor:not-allowed; }
  button.lit { background:var(--accent); color:#fff; } /* 押せる状態（受け付け中）は反転して目立たせる */
  button.off, button.off:hover { background:#c3c9d0 !important; color:#fff !important; border-color:#c3c9d0 !important; cursor:not-allowed; opacity:1; }
  .data { width:100%; border-collapse:collapse; font-size:13px; }
  .data td { border-bottom:1px solid var(--line); padding:5px 4px; }
  .data tr.sub th { text-align:left; font-size:12px; color:var(--sub); font-weight:600; padding:10px 4px 3px; border-bottom:1px solid var(--line); }
  .data td:first-child { white-space:nowrap; color:var(--sub); width:7.5em; vertical-align:top; }
  .landnote { margin-top:6px; font-size:11px; }
  .data td:first-child { color:var(--sub); width:42%; }
  details.trace { margin-top:8px; font-size:12px; border-top:1px dashed var(--ai-line); padding-top:4px; line-height:1.5; }
  details.trace summary { cursor:pointer; color:var(--sub); }
  details.trace pre { white-space:pre-wrap; word-break:break-all; background:#fff; border:1px solid var(--line); border-radius:4px; padding:6px 8px; margin:3px 0 8px; max-height:260px; overflow:auto; font-size:11.5px; }
  details.trace .tw { color:#b4472b; }
  .trig { margin-top:6px; font-size:12px; line-height:1.5; color:var(--sub); border-left:3px solid var(--line); padding:2px 8px; }
  .trig.mid { border-left-color:#d9a13b; }
  .trig.on { border-left-color:#c0392b; color:#8a2a1e; background:#fdf0ee; }
  .ai { background:var(--ai); border-left:4px solid var(--ai-line); padding:10px 12px; margin:10px 0 4px; font-size:15px; line-height:1.7; border-radius:4px; }
  .ai .tag { font-size:11px; color:#a0701a; display:block; margin-bottom:2px; }
  .me { text-align:right; margin:8px 0; font-size:14px; }
  .me span { background:#e6f0fa; padding:6px 10px; border-radius:12px; display:inline-block; text-align:left; white-space:pre-wrap; } /* 吹き出しは右寄せのまま、中の折り返しは左から */
  .hint { font-size:12px; color:var(--sub); }
  .rownote { margin:0 0 4px; }
  .sheet { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:13px; }
  .sheet h3 { font-size:13px; margin:8px 0 4px; }
  .empty { color:#b4472b; }
  .will { display:none; font-size:12px; color:#6b4fa0; border-top:1px dotted #6b4fa0; margin-top:6px; padding-top:4px; }
  body.design .will { display:block; }
  .row.done button { opacity:.45; cursor:default; }
  .row.done.retry button { cursor:pointer; }
  .row button.sel { background:#b9d5f0; border-width:2px; }
  .row.done button.chosen { opacity:1; background:var(--accent); color:#fff; }
  .row.done textarea { display:none; }
  .row.done > button:only-of-type, .row.done .hint:not(.rownote) { display:none; } /* 判定の決まりの注記は、答えた後も残す */
  .route { font-size:13px; background:#eef4fb; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-top:12px; line-height:1.7; }
  .route:empty { display:none; }
  .qround { display:inline-block; font-size:13px; color:#c0392b; margin-right:8px; vertical-align:middle; }
  .qnum { display:inline-block; font-size:20px; color:#c0392b; margin-right:6px; vertical-align:middle; }
  .opt { display:inline-block; min-width:18px; height:18px; line-height:18px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; text-align:center; margin-right:6px; }
  .row.done button.chosen .opt { background:#fff; color:var(--accent); }
  button.demo-next { outline:3px solid #c0392b; outline-offset:2px; }
  .demo { position:fixed; left:12px; bottom:12px; max-width:380px; z-index:1000; background:#2b2a26; color:#f4f0e6; font-size:13px; line-height:1.6; padding:10px 14px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .demo span { color:#e6c98f; }
  .demo-badge { display:inline-block; color:#fff; background:#c0392b; border-radius:50%; width:24px; height:24px; text-align:center; line-height:24px; font-size:15px; margin-right:2px; vertical-align:middle; }
  .hidden { display:none; }
  .row.survey .sgroup { margin:8px 0 4px; }
  .row.survey .sg-title { font-size:13px; font-weight:600; margin-bottom:2px; }
  .row.survey .sgroup button { font-size:13px; padding:6px 10px; }
  .row.survey .sgroup[data-g="N"], .row.survey .sgroup[data-g="W"] { margin-left:14px; padding-left:8px; border-left:3px solid var(--line); }
  .row.survey .sgroup[data-g="W"] { margin-left:28px; }
  .row.survey.done .sgroup button:not(.chosen) { display:none; }
  .row.survey.done.retry .sgroup button:not(.chosen) { display:inline-block; }
  .viewbar { display:flex; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.2); overflow:hidden; }
  .viewbar button { margin:0; border:none; border-radius:0; padding:7px 12px; font-size:13px; }
  .viewbar button.on { background:var(--accent); color:#fff; }
  .svbox { position:absolute; inset:0; z-index:900; background:#ddd; }
  .svbox iframe { width:100%; height:100%; border:0; display:block; }
  #map.sv-on .leaflet-control-zoom, #map.sv-on .leaflet-control-attribution { display:none; }
  .svnote { position:absolute; right:10px; top:52px; max-width:46%; font-size:12px; background:rgba(255,255,255,.92); padding:4px 8px; border-radius:4px; pointer-events:none; }
  .textline { display:flex; flex-direction:column; gap:6px; margin-top:8px; align-items:flex-end; } /* 2 対話型：自分で書く欄が主役。送信は枠の下 */
  .textline button { margin:0; padding:7px 22px; }
  textarea.other { width:100%; min-width:0; margin:0; padding:8px; min-height:4.2em; }
  .row > button { font-size:13px; padding:5px 10px; }
  .row > button .opt { min-width:15px; height:15px; line-height:15px; font-size:10px; margin-right:4px; }
  .pickhint { font-size:12px; color:#777; margin:6px 0 4px; }
  .row.done .pickhint { display:none; }
  textarea { field-sizing:content; resize:none; overflow:hidden; font-family:inherit; line-height:1.5; min-height:2.6em; } /* 書いた分だけ縦に伸びる（例の文も全部見える） */
  #fMsg { min-height:5.5em; }
  .row.done textarea.other, .row.done .textline button:not(.chosen) { display:none; }
  input[type=text], input[type=email], input[type=tel], select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; margin-bottom:4px; }
  button.small { font-size:12px; padding:5px 10px; }
  button.inq { width:100%; margin-top:18px; border-style:dashed; }
  #inq { border-top:1px solid var(--line); margin-top:16px; }
  details { font-size:12px; color:var(--sub); margin-top:16px; }
  .logline { font-size:12px; color:var(--sub); padding:4px 14px; border-bottom:1px solid var(--line); flex:none; }
</style>
</head>
<body>
<header id="appbar" data-current="user" data-title="2. 土地の相談 ― 対話型（試作）">
  <span class="appextra"><label><input type="checkbox" onchange="document.body.classList.toggle('design', this.checked)"> 設計メモ（渡したもの／開けた穴）</label></span>
</header>
<script src="js/shell.js"></script>
<script src="js/shophp.js"></script>
<script src="js/around.js"></script>
<div class="logline">入力内容を含む、機能改善のためのログを自動で記録します。開発調査に利用させていただきます。</div>
<div class="wrap">
  <div id="map"></div>
  <aside>
    <div id="step0">
      <h2>土地のある市区町村</h2>
      <div class="pc-row">
        <div class="pc"><label for="prefName">都道府県</label>
          <div class="combo"><input id="prefName" type="text" placeholder="例：東京都" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false"><ul class="combo-list" id="prefList" role="listbox" hidden></ul></div></div>
        <div class="pc"><label for="cityName">市区町村</label>
          <div class="combo"><input id="cityName" type="text" placeholder="例：千代田区" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false"><ul class="combo-list" id="cityList" role="listbox" hidden></ul></div></div>
      </div>
      <button id="openMap" class="primary">地図を開く</button>
      <div id="mapMsg" class="hint"></div>
    </div>
    <div id="step1" class="hidden">
      <h2>地図をクリックして場所を指定</h2>
      <div class="hint">ピンは地図を拡大して、土地の正確な位置に置いてください。位置が正確なほど、見立てが確かになります。</div>
      <button id="preset" class="small hidden">例：鷺山の旗竿地にピンを置く</button>
      <div id="picked" class="hint">まだ指定されていません</div>
      <label for="area">面積（㎡）</label>
      <input id="area" type="number" placeholder="例：120" min="10" autocomplete="off" inputmode="numeric">
      <button id="go" class="primary off">評価する</button>
    </div>
    <div id="route" class="route"></div>
    <div id="result"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// 開き直し・リロード＝新しい体験。前の体験の記録は消す（「利用状況」は、評価するまでグレー）
try { localStorage.removeItem("reSession_2_talk"); } catch (e) { /* 何もしない */ }
if (window.Shell) Shell.refresh();
// ---- 仮データ（実在しない数値） ----
const POINTS = [
  { name:"岐阜駅前",  lat:35.4095, lng:136.7564, price:300000, zone:"商業地域" },
  { name:"柳ケ瀬",    lat:35.4237, lng:136.7608, price:180000, zone:"商業地域" },
  { name:"長良",      lat:35.4430, lng:136.7700, price:120000, zone:"第一種住居地域" },
  { name:"鷺山",      lat:35.4480, lng:136.7350, price:80000,  zone:"第一種低層住居専用地域" },
  { name:"茜部",      lat:35.3900, lng:136.7500, price:90000,  zone:"第一種住居地域" },
];
// 近く（NEAR_MAX_M 以内）に標準地がなければ「データなし」として扱う（仮データは岐阜市中心部の5地点のみ。遠い標準地の数字を最寄りとして出すと、利用者を混乱させるため）
const NEAR_MAX_M = 5000;
const NO_DATA = { name:"データなし", none:true, d:null, price:null, zone:null };
const NO_DATA_TEXT = "データなし（公開データは準備中）";
// 店の土地勘・地区の事実（鷺山の事後評価など）は、その標準地のごく近く（LOCAL_MAX_M 以内）だけに使う。離れた場所には当てはめない
const LOCAL_MAX_M = 1500;
const localNear = n => (n && !n.none && n.d <= LOCAL_MAX_M ? n.name : null);
// 事業所の土地勘（プレファレンス）
const PREF = {
  office: "弊社", // 実装のときは、導入先の社名に差し替える（基本は「弊社」）
  strengths: ["売買仲介", "隣地との一体活用の提案"],
  localKnowledge: {
    "長良": "川沿いは景観で指名買いがある。北側の駐車場は所有者が売却に前向き。",
    "鷺山": "旗竿地が多く相場より厳しく見られがち。隣地取得で化ける例を複数扱った。",
    "茜部": "幹線沿いは店舗需要あり。奥は住宅地として落ち着いている。",
    "柳ケ瀬": "空き店舗の転用相談が増えている。",
    "岐阜駅前": "狭小地でも収益物件の引き合いがある。"
  },
  tone: "踏み込むが嘘はつかない"
};

function distM(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// ---- 地図 ----
const map = L.map("map").setView([35.423, 136.760], 13);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>', maxZoom: 18
}).addTo(map);
let pin = null, here = null, mapOpen = false, ADDR = "", addrSeq = 0;
// ピンの位置の住所（国土地理院の逆ジオコーダー：市区町村コード＋町丁目）。「東京都中央区日本橋茅場町二丁目付近」の形で、座標の前に出す
async function lookupAddr(lat, lng, xy) {
  const my = ++addrSeq;
  try {
    const r = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`);
    const j = await r.json(), x = j && j.results;
    if (!x || my !== addrSeq) return;
    const c = MUNI && MUNI.codes && (MUNI.codes[x.muniCd] || MUNI.codes[String(+x.muniCd)]); // 地理院は「03211」、一覧は「3211」（0で始まる北海道〜栃木県）
    const a = (c ? c[0] + c[1].replace(" ", "") : "") + (x.lv01Nm && x.lv01Nm !== "－" ? x.lv01Nm : "");
    if (!a) return;
    ADDR = a + "付近";
    document.getElementById("picked").textContent = `${ADDR}　指定: ${xy}`;
    if (c && !REPLAYING) followPin(c[0], c[1]);
    if (S && S.sheet && !REPLAYING) { S.sheet.所在 = `${ADDR}（${xy}）`; saveSession(); }
  } catch (e) { /* 住所が引けなくても、座標で進める */ }
}
// ピンが選んだ市区町村の外にあれば、欄をピンの場所に合わせる（ピンが一番正確な場所。地図をずらして隣の市に置くのは自然な動き）
// 政令市は、「名古屋市」を選んでいて区の中に置いたなら同じ扱い。区まで選んでいて別の区なら、その区に合わせる。一覧にない名前（旧市町村など）なら変えない
function followPin(pref, city) {
  const selP = prefInp.value.trim(), selC = cityInp.value.trim();
  if (pref === selP && (city === selC || city.split(" ")[0] === selC)) return;
  if (!(MUNI && (MUNI.munis[pref] || []).includes(city))) return;
  prefInp.value = pref; cityInp.value = city; PREF_AT = pref;
  PLACE = OPENED_AT = pref + city; refreshOpen(); // 地図はもう開いているので、「地図を開く」はグレーのまま
  document.getElementById("mapMsg").textContent = `ピンの場所に合わせて、${pref}${city}にしました。`;
  saveSession();
}
function setPin(lat, lng) {
  here = { lat, lng };
  if (pin) pin.setLatLng([lat, lng]); else pin = L.marker([lat, lng]).addTo(map);
  const xy = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  document.getElementById("picked").textContent = `指定: ${xy}`;
  ADDR = ""; lookupAddr(lat, lng, xy);
  refreshGo();
  ev("pin", { lat:+lat.toFixed(4), lng:+lng.toFixed(4) }); // 元に戻す（再表示）で、同じ場所にピンを置けるように
}
map.on("click", e => { if (mapOpen) setPin(e.latlng.lat, e.latlng.lng); });
// カーソル：止まって1秒で十字、動かす・ドラッグ・拡大縮小・地図の外へ出ると掌に戻す。地図を開く前（ピンを置けない）は掌のまま
{
  const box = document.getElementById("map"); let aimT = 0;
  const unaim = () => { clearTimeout(aimT); box.classList.remove("aim"); };
  box.addEventListener("mousemove", e => { unaim(); if (mapOpen && !e.buttons) aimT = setTimeout(() => box.classList.add("aim"), 500); });
  map.on("dragstart zoomstart", unaim); box.addEventListener("mouseleave", unaim); // 押しただけ（ピンを置くクリック）では戻さない
}
const goBtn = document.getElementById("go"), areaInp = document.getElementById("area");
// 「評価する」は、同じピン・同じ面積ではもう押せない（押し直すと会話が最初からになるため）。ピンを置き直すか面積を変えると点灯する
let EVAL_AT = "";
const goKey = () => here ? `${here.lat.toFixed(6)},${here.lng.toFixed(6)}|${Number(areaInp.value) || 0}` : "";
const refreshGo = () => lamp(goBtn, !!here && Number(areaInp.value) >= 10 && goKey() !== EVAL_AT);
areaInp.addEventListener("input", refreshGo);
document.getElementById("preset").onclick = () => {
  // 例のピンは岐阜市にあるので、市区町村の表示も岐阜県岐阜市に合わせる（別の市区町村を選んでいた場合も、ピンと表示が食い違わないように）
  prefInp.value = "岐阜県"; cityInp.value = "岐阜市"; PREF_AT = "岐阜県"; OPENED_AT = "岐阜県岐阜市"; refreshOpen(); PLACE = "岐阜県岐阜市"; mapOpen = true; document.getElementById("step1").classList.remove("hidden");
  map.setView([35.4482, 136.7352], 16); setPin(35.4482, 136.7352);
};

// ---- 0. 都道府県・市区町村 → 地図を開く（国土地理院の住所検索で中心を出す） ----
map.setView([36.2, 137.5], 5); // 開く前は日本全体
let PLACE = ""; // 都道府県・市区町村は空白で始める（日本地図から）
// ---- ボタンの点灯／グレー：受け付けられる入力があれば点灯、未入力ならグレー ----
const lamp = (btn, ok) => { btn.classList.toggle("off", !ok); btn.classList.toggle("lit", !!ok); btn.setAttribute("aria-disabled", ok ? "false" : "true"); };
// グレーのボタンは、人が押しても何も起きない（無効）。画面の中の再現（巻き戻し・元に戻す・デモ）が内部で押す分は通す
document.addEventListener("click", e => {
  const b = e.target.closest && (e.target.closest("button.off") || (document.body.classList.contains("ai-wait") && e.target.closest("#talk .row.done button")));
  if (b && e.isTrusted) { e.preventDefault(); e.stopPropagation(); }
}, true);
const prefInp = document.getElementById("prefName"), cityInp = document.getElementById("cityName"), openBtn = document.getElementById("openMap");
// 一覧：カーソルを入れる／押すと開く。都道府県を選ぶと、その都道府県の市区町村だけが候補に出る（連動）

    else if (!shown.length) { const li = document.createElement("li"); li.className = "none"; li.textContent = "候補がありません"; ul.appendChild(li); }

（${staff ? "弊社のこと" : nm + "のこと"}は、上の【店のこと】にあります）`;
  // 重なりを探す：①〜③の返事（n=0）と締めでは、利用者の事情 × 公開データ × HPの得意 を突き合わせる
  if (n === 0 || isLast(n)) c += `\n\n【この返事では、重なりを探します】利用者が選んだ項目・書いた言葉、土地の条件（公開データ）と、${staff ? "弊社のこと" : nm + "のホームページから読んだこと"}（よく受けている相談・合う相談・強み・専門家）を突き合わせます。重なったら、どの事情とどの得意が重なったかが分かる一言にします（${staff ? "例：「弊社は旗竿地や再建築不可の売却を多く扱っています」" : `例：「${nm}のホームページには、旗竿地や再建築不可の売却を扱っていると書かれています」。出どころを必ず付けます`}）。重ならなくても、合いにくい相談に当たるなら、正直にそう伝えます（例：${staff ? "「弊社は売却が中心です」" : `「${nm}のホームページは、売却を中心に書いています」`}）。どちらにも当たらなければ、無理に結びつけません。`;
  c += staff ? "\nホームページの宣伝の言葉（「最短〇日」「〇社以上」「〇万円で売却」など）は、弊社のことに書かれていなければ言いません。" : "\nホームページの宣伝の言葉（「最短〇日」「〇社以上」「〇万円で売却」など）は、事実として言わず、言うなら「ホームページには〜とあります」の形にします。";
  const asks = (TALK.asks || []).filter(a => a && a.trim());
  if (asks.length) c += `\n\n【${nm}が、利用者から聞きたいこと（聞きたい順）】\n` + asks.map((a, x) => `${x + 1}. ${a}`).join("\n")
    + "\nまだ聞けていないものを、話の流れで自然に聞ける所で一つだけ聞きます。不自然なら利用者の話を追います。質問の言い回しは自分で考えます。";
  // 締め：まだ決まっていない点を一つ名指しし、現地を見ないと決まらない理由を一言。社員目線は引き受け、外野目線は店へ持っていく問いとして渡す
  const CLOSE = staff
    ? `ここまでの土地の条件と利用者の話から、まだ決まっていないことを一つ名指しし（例：前の道の幅、境目が確定しているか、建物に評価がつくか）、それが現地を見ないと決まらない理由を一言添えて、「そこは弊社が現地で確かめます」と引き受けます。引き受けの中身は「弊社が引き受けること」の範囲だけにします。`
    : `ここまでの土地の条件と利用者の話から、まだ決まっていないことを一つ名指しし（例：前の道の幅、境目が確定しているか、建物に評価がつくか）、それが現地を見ないと決まらない理由を一言添えて、「${nm}に『〜を現地で見てもらえますか』と聞くと、話がはっきりします」のように、${nm}へ持っていく問いを一つ渡します。${nm}の代わりに約束はしません。ホームページから読んだ合う相談とこの件が重なれば、出どころを付けてそれも添えます。`;
  const CLOSE_LAST = "最初に、ここまでの話で分かったことを一言でまとめます。" + CLOSE + `問い合わせの案内は画面が決まった一文で添えるので、書きません。「ここまでです」「お答えできるのは以上です」のような打ち切りの言葉は使いません。`;
  const hands = (TALK.hands || []).map((h, x) => ({ h, x })).filter(o => o.h[0] && o.h[0].trim());
  if (hands.length && !HANDED) c += `\n\n【${nm}を勧める場面】\n` + hands.map(o => `${o.x + 1}. ${o.h[0]}` + (o.h[1] ? `（理由：${o.h[1]}）` : "")).join("\n")
    + `\n利用者の話がこのどれかに当たったら、その返事で${staff ? "弊社が直接うかがう方がよいと" : `「ここから先は${nm}に聞いた方がいい」と`}理由を添えて勧めます。そのときの返事は、次の締めの形にします。${CLOSE}問いかけは付けません。返事の最後に、行を分けて【勧める:番号】とだけ書きます。当たらなければ書きません。`;
  c += "\n" + (TONE_TXT[TALK.tone] || TONE_TXT.mid);
  if (HANDED) c += `\n\n【すでに${me}を勧めました（${HANDED[0]}）】画面には問い合わせの欄が出ています。利用者の言葉に短く答えます。もう一度勧め直したり、【勧める】を書いたりしません。`;
  if (isLast(n)) c += `\nこれが最後の返事です。直前の利用者の言葉に短く答えてから、締めます。${CLOSE_LAST}問いかけは付けません。`;
  return c;
}
function closeNow() { return HANDED && HANDED[1] ? `ご相談をおすすめする理由：${HANDED[1].replace(/ので$/, "")}` : ""; }
function goStep(i, lead, real) {
  const m = String(lead).match(/\s*(?:<br>)*\s*【勧める[:：]\s*(\d+)】\s*$/);
  if (i === 0) { HANDED = null; HAND_AT = 0; } // 初めの返事（再表示のやり直しも）で、勧めた印を戻す
  const fresh = !!(m && !HANDED && TALK.hands[+m[1] - 1]);
  if (m) lead = lead.slice(0, m.index);
  if (fresh) { HANDED = TALK.hands[+m[1] - 1]; HAND_AT = i; S.sheet.勧めた場面 = esc(HANDED[0]); }
  lead = String(lead).replace(/【勧める[:：]?\s*\d*】/g, "");
  if (isLast(i)) { // 締め：AIの最後の返事＋固定の締め（END）
    if (!HANDED) S.sheet.勧めた場面 = "（往復の上限まで話した）";
    say(lead + "<br>" + END, real ? "渡したもの：一つ前の言葉へのAIの返事" : "渡したもの：台本", HANDED ? `店へ渡した：勧める場面「${esc(HANDED[0])}」` : `店へ渡した：フリートークの回数（${FREE_T}）`);
    STAGE = "店を勧めた"; inquiryBar(true); saveSession();
    return;
  }
  say(lead, real ? "渡したもの：一つ前の言葉へのAIの返事" : "渡したもの：台本",
    fresh ? `店へ渡した：勧める場面「${esc(HANDED[0])}」（フリートークは ${FREE_T} 往復まで）` : `開けた穴：書き欄で続ける（${FREE_T} 往復の ${i + 1} 往復目）`);
  if (fresh) { STAGE = "店を勧めた"; inquiryBar(); }
  choices([], null, t => {
    if (!t) return;
    S.sheet.事情 = (S.sheet.事情 ? S.sheet.事情 + " / " : "") + esc(t);
    if (i === 0) S.sheet.相談目的 = esc(t.slice(0, 60));
    const userText = "【利用者の言葉】\n" + t; // 利用者の言葉は資料として渡す（指示として読ませない）
    if (REPLAYING || AI_OFF) {
      const rp = RESTORE && RESTORE.replies.shift();
      AI_HIST.push({ role:"user", content:userText }, { role:"assistant", content:rp ? rp.reply : "（以前の返答）" });
      goStep(i + 1, rp ? esc(rp.reply).replace(/\n/g, "<br>") : '<span class="hint">（AIの返事：外の人が、この言葉に短く答えて一つ聞く）</span>', !!rp);
      return;
    }
    askAI(i + 1, false, userText, { q:4 + i, press:"", typed:true, branch:"", branchBy:"", place:PLACE, near:S.near.name, road:S.sheet.接道 || "", intent:S.sheet.持ち主の意向 || "", kind:"対話" })
      .then(r => goStep(i + 1, r ? r : '<span class="hint">（返事を作れませんでした）</span>' + AI_FAIL, !!r));
  }, 4 + i, "ここに書いて送ってください");
}
// 記録に「対話型」の印を付ける（開発利用状況・元に戻すで、AI型と分ける）
buildState = (f => () => ({ ...f(), type:"talk" }))(buildState);
buildPre = (f => () => ({ ...f(), type:"talk" }))(buildPre);

if ("BroadcastChannel" in window) {
  const userCh = new BroadcastChannel("reUser");
  userCh.onmessage = e => {
    if (!e.data || e.data.type !== "restore" || !e.data.data) return;
    if (!e.data.data.state || e.data.data.state.type !== "talk") return; // AI型の記録は AI型の画面が戻す
    try { restoreSession(e.data.data); userCh.postMessage({ type:"restored", sid:e.data.data.sid }); }
    catch (err) { REPLAYING = false; userCh.postMessage({ type:"restore-failed", sid:e.data.data.sid, message:String(err && err.message || err) }); }
  };
}
