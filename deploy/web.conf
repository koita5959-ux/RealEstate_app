# コンテナ内の Nginx。/docs/... を出し、/api/ は api サービスへ渡す。
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # api が止まっていても、この Nginx は起動できるように名前解決を遅らせる
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 64k;
        proxy_read_timeout 90s;
    }

    absolute_redirect off; # 外向きのアドレス（/RealEstate_app/…）のまま返す
    # 2026-11-09 の並べ替え前のURL（docs/proto/…）を、新しい名前へ移す
    location = /docs/proto/              { return 301 /RealEstate_app/docs/3_ai_main.html$is_args$args; }
    location = /docs/proto/index.html    { return 301 /RealEstate_app/docs/3_ai_main.html$is_args$args; }
    location = /docs/proto/admin_mode.html { return 301 /RealEstate_app/docs/3_ai_admin.html$is_args$args; }
    location = /docs/proto/report.html   { return 301 /RealEstate_app/docs/3_ai_report.html$is_args$args; }
    location = /docs/proto/shell.js      { return 301 /RealEstate_app/docs/js/shell.js; }

    location / {
        try_files $uri $uri/ =404;
    }
}
