# コンテナ内の Nginx。PR版の画面（/pr-fudosan/・/pr-kantei/）とサンプルHP（/sample/・/sample-kantei/）を出し、/api/ は api サービスへ渡す。
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # api が止まっていても、この Nginx は起動できるように名前解決を遅らせる
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 64k;
        proxy_read_timeout 160s; # AIのやり直し（最大70秒）・HPの読み取り（最大150秒）を途中で切らない
    }

    # 試験用のメール受け（MailHog）。外からは /RealEstate_app/mailhog/ 。開発利用状況と同じ admin のパスワード
    location = /mailhog { return 301 /RealEstate_app/mailhog/; }
    location /mailhog/ {
        auth_basic "RealEstate_app mailhog";
        auth_basic_user_file /etc/nginx/mailhog.htpasswd;
        set $mh http://mailhog:8025;
        rewrite ^/mailhog/(.*)$ /RealEstate_app/mailhog/$1 break;
        proxy_pass $mh;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # 新着を知らせる WebSocket
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    absolute_redirect off; # 外向きのアドレス（/RealEstate_app/…）のまま返す
    # 2026-11-09 の並べ替え前のURL（docs/proto/…）を、新しい名前へ移す
    location = /docs/proto/              { return 301 /RealEstate_app/pr-fudosan/3_ai_main.html$is_args$args; }
    location = /docs/proto/index.html    { return 301 /RealEstate_app/pr-fudosan/3_ai_main.html$is_args$args; }
    location = /docs/proto/admin_mode.html { return 301 /RealEstate_app/pr-fudosan/3_ai_try.html$is_args$args; }
    location = /docs/proto/report.html   { return 301 /RealEstate_app/pr-fudosan/3_ai_report.html$is_args$args; }
    location = /docs/proto/shell.js      { return 301 /RealEstate_app/pr-fudosan/js/shell.js; }
    # 2026-11-24 の版ごとのフォルダより前のURL
    location /docs/sales/ { rewrite ^/docs/sales/(.*)$ /RealEstate_app/pr-fudosan/$1 permanent; }
    location /docs/old/   { return 301 /RealEstate_app/sample/; } # 古い試作は 11-25 に消した
    location /docs/       { rewrite ^/docs/(.*)$ /RealEstate_app/pr-fudosan/$1 permanent; }
    location = /docs      { return 301 /RealEstate_app/pr-fudosan/; }
    location = /          { return 302 /RealEstate_app/sample/; }

    # 2026-11-25 の整理より前の版（dev・dev-old・dev-satei・sales → 不動産PR版、sales-kantei → 鑑定PR版）。管理画面（*_admin.html）はお試し設定（*_try.html）へ
    location ~ ^/sales-kantei/(.*)$ { return 301 /RealEstate_app/pr-kantei/$1$is_args$args; }
    location ~ ^/(dev|dev-old|dev-satei|sales)/(\d_[a-z]+_)admin\.html$ { return 301 /RealEstate_app/pr-fudosan/$2try.html$is_args$args; }
    location ~ ^/(dev|dev-old|dev-satei|sales)/(.*)$ { return 301 /RealEstate_app/pr-fudosan/$2$is_args$args; }

    location = /sample { return 301 /RealEstate_app/sample/$is_args$args; } # 末尾の / がないと画像が切れる

    # 広告ページ（サンプルHPのヘッダーから）。開発元・戻り先を api が差し込む。画像・CSS は下の / からそのまま
    location = /sample/pr { return 301 /RealEstate_app/sample/pr/$is_args$args; }
    location ~ ^/sample/pr/(index\.html)?$ {
        set $api http://api:3000;
        proxy_pass $api/api/sample?page=pr&$args;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }

    # 鑑定士版のサンプルHP「AIボット鑑定」（11-24）。入口は api が地区名を差し込み、画像・CSS は下の / から
    location = /sample-kantei { return 301 /RealEstate_app/sample-kantei/$is_args$args; }
    location = /sample-kantei/pr { return 301 /RealEstate_app/sample-kantei/pr/$is_args$args; }
    location ~ ^/sample-kantei/pr/(index\.html)?$ {
        set $api http://api:3000;
        proxy_pass $api/api/sample?page=kantei-pr&$args;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }
    location ~ ^/sample-kantei/(index\.html)?$ {
        set $api http://api:3000;
        proxy_pass $api/api/sample?page=kantei&$args;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }

    # サンプルHPの入口は api が地区名を差し込んで返す（開いた記録も api で）
    location ~ ^/sample/(index\.html)?$ {
        set $api http://api:3000;
        proxy_pass $api/api/sample$is_args$args;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache"; # 画面・部品は、使うたびに新しい版か確かめる（直した版が古いまま出ないように）
    }
}
