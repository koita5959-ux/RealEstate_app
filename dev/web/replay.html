<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>再表示</title>
<style>
  html, body { margin:0; height:100%; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; background:#eef1f5; }
  body { display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:6px; padding:6px 10px; background:#2b2f36; color:#fff; font-size:13px; flex-wrap:wrap; }
  .bar b { font-size:14px; margin-right:6px; }
  .tab { border:0; border-radius:6px 6px 0 0; padding:6px 16px; font-size:13px; cursor:pointer; background:#5b6270; color:#fff; }
  .tab.on.user { background:#1f6feb; } .tab.on.admin { background:#c0392b; }
  .note { margin-left:auto; color:#c9d1d9; font-size:12px; }
  .wrap { flex:1; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  iframe[hidden] { display:none; }
  .warn { display:none; padding:6px 12px; background:#fff3cd; color:#7a4b00; font-size:13px; border-bottom:1px solid #e0c36a; }
  .warn.show { display:block; }
</style>
</head>
<body>
<div class="bar">
  <b id="ttl">再表示</b>
  <button class="tab user on" data-k="user">メイン画面</button>
  <button class="tab admin" data-k="admin">管理画面</button>
  <span class="note" id="msg">記録を読み込んでいます…</span>
</div>
<div class="warn" id="warn"></div>
<div class="wrap">
  <iframe id="f-user"></iframe>
  <iframe id="f-admin" hidden></iframe>
</div>
<script>
// 開発利用状況の「Talk表示／Multi表示／TYPE1表示」から開く：そのセッションのメイン画面と管理画面を、この1つの窓のタブで見る（11-25 ユーザー）
// メイン画面が記録を戻し（管理画面の設定も書き戻す）、終わってから管理画面を読み込む
const QS = new URLSearchParams(location.search), sid = QS.get("sid") || "", type = QS.get("type") || "ai";
const pre = type === "talk" ? "2_talk_" : type === "select" ? "1_select_" : "3_ai_";
const name = type === "talk" ? "TalkSession" : type === "select" ? "TYPE1" : "MultiSession";
const fu = document.getElementById("f-user"), fa = document.getElementById("f-admin"), msg = document.getElementById("msg");
document.getElementById("ttl").textContent = name + "（" + sid.slice(0, 8) + "）";
document.title = "再表示 " + name + " " + sid.slice(0, 8);
fu.src = pre + "main.html?replay=" + encodeURIComponent(sid) + "&ai=off";
let adminLoaded = false;
const loadAdmin = () => { if (adminLoaded) return; adminLoaded = true; fa.src = pre + "admin.html?replay=" + encodeURIComponent(sid); };
addEventListener("message", e => {
  if (!e.data || e.data.sid !== sid) return;
  if (e.data.type === "re-replayed") { msg.textContent = "記録の時点に戻しました（見るための画面です）"; loadAdmin(); }
  if (e.data.type === "re-replay-failed") { msg.textContent = "記録を読み込めませんでした（" + e.data.message + "）"; }
});
setTimeout(loadAdmin, 15000); // 合図が来なくても、管理画面は開けるようにする
// 11-25 より前の記録には店の設定がなく、管理画面は今のブラウザの設定を出す。そのことと、記録に残る目線を管理画面のタブの上に出す
const warn = document.getElementById("warn");
let warnText = "";
fetch("../api/admin/session?sid=" + encodeURIComponent(sid), { cache:"no-store" }).then(r => r.ok ? r.json() : null).then(d => {
  if (!d || d.hasSettings) return;
  const modes = [...new Set((d.turns || []).map(t => t.mode).filter(Boolean))];
  const mt = modes.map(m => m === "staff" ? "社員目線" : "外野目線").join("・");
  warnText = "この記録には当時の管理画面の設定が残っていません。下は今のブラウザの設定です（当時と違うことがあります）。" + (type === "talk" && mt ? "記録に残る目線：" + mt : "");
  warn.textContent = warnText;
  warn.classList.toggle("show", !fa.hidden);
}).catch(() => {});
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  warn.classList.toggle("show", !!warnText && b.dataset.k === "admin");
  if (b.dataset.k === "admin") loadAdmin();
  fu.hidden = b.dataset.k !== "user"; fa.hidden = b.dataset.k !== "admin";
});
</script>
</body>
</html>
