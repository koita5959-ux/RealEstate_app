# RealEstate_app 試作の公開用。ほかのサイトとは別コンテナ・別ポート。
# サーバーの Nginx が /RealEstate_app/ をここ（127.0.0.1:8110）へ渡す。
# 版ごとのフォルダ（2026-11-24）：dev/＝開発の本線、sales/＝セールス版＋サンプルHP、clients/＝店用、core/＝全版共通のサーバー。
# web = 画面（各版の web/）と /api/ の振り分け。api = Claude への問い合わせ（core/server/）。AIへの指示は各版の prompts/。
services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8110:80"
    volumes:
      - ./dev/web:/usr/share/nginx/html/dev:ro       # 開発の本線 /RealEstate_app/dev/
      - ./dev-satei/web:/usr/share/nginx/html/dev-satei:ro # 作業の版：査定スキル（仕上がったら dev へ）
      - ./sales/web:/usr/share/nginx/html/sales:ro   # セールス版のボット・お試し設定 /RealEstate_app/sales/
      - ./archive:/usr/share/nginx/html/archive:ro   # 古い試作
      - ./sales/site:/usr/share/nginx/html/sample:ro # サンプルHPの画像・CSS（index.html は api が返す）
      - ./deploy/web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/mailhog.htpasswd:/etc/nginx/mailhog.htpasswd:ro # MailHog の画面の入口（admin のパスワードから作る）
    restart: unless-stopped

  api:
    build: ./core/server
    # ポートは外に出さない。web コンテナからだけ api:3000 で届く。
    environment:
      TZ: Asia/Tokyo
      MODEL: claude-opus-5-5     # 変更例: claude-haiku-5-5（安い）/ claude-sonnet-5-5
      EFFORT: low
      DAILY_USD_CAP: "2"         # 1日の推定費用の上限（USD）。超えると止まる
      SMTP_HOST: mailhog         # 問い合わせのメール。試験は MailHog が受け止める（外に出ない）。本番で本物の SMTP に替える
      SMTP_PORT: "1025"
      MAIL_FROM: bot@example.test   # 差出人（本番前に決める）
      MAIL_TO: shop@example.test    # 店の宛先（本番前に決める）
      # DISABLED: "1"            # 停止スイッチ（data/DISABLED というファイルでも止まる）
    secrets:
      - anthropic_api_key
      - admin_password   # 開発者向け管理画面（/api/admin/）の入口。ユーザー名は admin
      - reinfolib_api_key # 不動産情報ライブラリ。空のあいだは見本の値
      - google_maps_embed_key # ストリートビューの埋め込み。サイトを限定したキー（画面に渡す）
    volumes:
      - ./data:/data
      - ./sales/site:/site:ro # サンプルHP（?r= で地区名を差し込む）
      - ./dev/web/data/muni.json:/app/muni.json:ro
      - ./dev/prompts:/prompts/dev:ro     # AIへの指示（版ごと。画面の場所で使い分ける）
      - ./dev-satei/prompts:/prompts/dev-satei:ro
      - ./sales/prompts:/prompts/sales:ro # 物件の町名を拾う（shop/listings.js）
      - ./_works/2026-11-14_ClaudeCode_送付用の地区一覧:/regions:ro
    mem_limit: 256m
    restart: unless-stopped

  mailhog: # 試験用のメール受け（送ったメールを外に出さず受け止める）。画面 https://taskboard.asuscomm.com/RealEstate_app/mailhog/ （LAN からは http://192.168.0.123:8042/RealEstate_app/mailhog/）
    image: mailhog/mailhog
    environment:
      MH_UI_WEB_PATH: RealEstate_app/mailhog
    ports:
      - "8042:8025"
    restart: unless-stopped

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  admin_password:
    file: ./secrets/admin_password.txt
  reinfolib_api_key:
    file: ./secrets/reinfolib_api_key.txt
  google_maps_embed_key:
    file: ./secrets/google_maps_embed_key.txt
