<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>開発の利用状況（開発者用）</title>
<style>
  :root { --ink:#1f2933; --sub:#667085; --line:#e4e7ec; --bg:#f7f8fa; --card:#fff; --acc:#1d4ed8; --warn:#b42318; --ok:#067647; --bar:#93b4f5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 0 6px; }
  h2 { font-size:15px; margin:22px 0 8px; }
  h3 { font-size:13px; margin:14px 0 4px; color:var(--sub); font-weight:600; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 16px 60px; }
  nav { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); margin:8px 0 14px; }
  nav button { border:0; background:none; padding:9px 14px; font:inherit; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { color:var(--acc); border-bottom-color:var(--acc); font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card .t { font-size:12px; color:var(--sub); }
  .card .v { font-size:22px; font-weight:600; }
  .card .s { font-size:12px; color:var(--sub); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; font-size:13px; }
  th, td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#f2f4f7; color:var(--sub); font-weight:600; white-space:nowrap; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  .bar { height:10px; background:var(--bar); border-radius:3px; min-width:1px; }
  .barbox { display:flex; align-items:center; gap:8px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:#eef2f6; color:var(--sub); }
  .pill.ok { background:#d1fadf; color:var(--ok); } .pill.warn { background:#fee4e2; color:var(--warn); }
  .note { font-size:12px; color:var(--sub); }
  .two { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
  input, select, button.act { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button.act { cursor:pointer; background:var(--acc); color:#fff; border-color:var(--acc); }
  .hide { display:none; }
  tr.replayable { cursor:pointer; } tr.replayable:hover td { background:#eef4fb; }
  a.btn-user-link { display:inline-block; font-size:12px; padding:2px 9px; border-radius:6px; background:#1d6fb8; color:#fff; text-decoration:none; white-space:nowrap; }
  details { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin:4px 0; }
  summary { cursor:pointer; }
  pre { white-space:pre-wrap; margin:6px 0 0; font:inherit; }
  .warnbox { background:#fff7e6; border:1px solid #f5d28a; border-radius:8px; padding:8px 12px; font-size:13px; }
</style>
</head>
<body>
<header id="appbar" data-current="dev" data-title="開発利用状況（開発者用）"></header>
<script src="../../docs/proto/shell.js"></script>
<div class="wrap">
<div class="toolbar">
  <span id="state" class="pill"></span>
  <span class="note" id="upd"></span>
  <button class="act" id="reload">更新</button>
  <span class="note">動きがあると自動で更新します（どのパソコンの動きも、数秒で入ります）</span>
</div>
<div class="note"><b>推定</b>＝Claude が返したトークン数に単価を掛けた額（動きのたびに変わる）。<b>実績</b>＝Console に出た日ごとの金額を、その日の往復へ推定の割合で割り振った額（「設定」で Console の数字を入れると確定します）。</div>
<nav id="tabs"></nav>
<main id="main"></main>
</div>
<script>
const BASE = location.pathname.replace(/\/?$/, "/");
const TABS = [["cost","費用"],["explain","費用の目安（販売用）"],["tested","何を試しているか"],["sessions","セッションとやり取り"],["settings","設定（残高・単価・為替）"]];
let D = null, tab = (location.hash || "#cost").slice(1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const usd = (v, d = 4) => v == null ? "—" : "$" + v.toFixed(d);
const jpy = v => v == null ? "—" : (v * D.config.usdJpy).toLocaleString("ja-JP", { maximumFractionDigits: v * D.config.usdJpy < 10 ? 2 : 0 }) + "円";
const money = (v, d = 4) => v == null ? "—" : `${usd(v, d)}<span class="note">（${jpy(v)}）</span>`;
const NUMQ = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫";
const stageOf = s => { // どこまで進んだか
  const base = s.maxQ ? (NUMQ[s.maxQ - 1] || s.maxQ) + "まで" : (["開いた", "地図を開いた", "ピンを置いた", "評価した"][s.reach] || "—");
  return base + (s.inqSend ? "・問い合わせを押した" : s.inqOpen ? "・問い合わせを開いた" : "");
};
const actual = x => x.rounds ? (x.fixed ? money(x.usd) + ' <span class="pill ok">確定</span>' : '<span class="note">未確定</span>') : '<span class="note">—</span>';
const tm = ts => ts ? new Date(ts).toLocaleString("ja-JP", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" }) : "—";
const num = v => v == null ? "—" : Math.round(v).toLocaleString("ja-JP");
const STAGE = { open:"画面を開いた", map:"地図を開いた", pin:"ピンを置いた", evaluate:"評価した", q1:"①に答えた", q2:"②に答えた", q3:"③に答えた", q4:"④（相談目的）に進んだ", q5:"⑤以降に進んだ", inquiry_open:"問い合わせを開いた", inquiry_send:"問い合わせを押した" };
const actorSel = () => window.actorSel || "all"; // 対象：全部／一般の訪問者（visitor）／テスト（visitor 以外）
const actorOk = s => actorSel() === "all" || (actorSel() === "visitor" ? s.by === "visitor" : s.by !== "visitor");
const actorSelect = () => `対象：<select id="asel"><option value="all" ${actorSel() === "all" ? "selected" : ""}>全部</option><option value="visitor" ${actorSel() === "visitor" ? "selected" : ""}>一般の訪問者（visitor）</option><option value="test" ${actorSel() === "test" ? "selected" : ""}>テスト（visitor 以外）</option></select>`;
const REASON = { disabled:"停止スイッチ", daily_cap:"1日の費用上限", rate_limited:"回数制限", busy:"同時処理の上限", no_key:"キー未設定" };

// 再表示（元に戻す）：画面は開かない。すでに開いている窓へ合図を送るだけ。
//  ・メイン画面：そのセッションの状態へ戻す（地図・ピン・①〜⑦の選択を再現し、AIの返事は記録にある本物の文）
//  ・利用状況の画面：そのセッションの表示に切り替える
// 届いたか（返事があったか）だけを、ここに通知する。メイン画面は今の表示が置き換わるので、先に確認する。
let replayTimer = null, replayWait = null;
function toast(msg, bad) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 16px;border-radius:8px;font-size:13px;color:#fff;z-index:2000;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:90vw"; document.body.appendChild(t); }
  t.textContent = msg; t.style.background = bad ? "#b42318" : "#067647"; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 5000);
}
const userCh = "BroadcastChannel" in window ? new BroadcastChannel("reUser") : null;
function settleReplay() { // 返事がそろった、または待ち時間が過ぎたとき、結果を通知する
  if (!replayWait) return;
  const w = replayWait; replayWait = null; clearTimeout(replayTimer);
  const parts = [], missing = [];
  if (w.wantUser) (w.gotUser ? parts : missing).push(w.gotUser ? "メイン画面を元に戻しました" : "メイン画面が開いていません（更新前の古い画面なら、リロードしてください）");
  if (w.wantReport) (w.gotReport ? parts : missing).push(w.gotReport ? "利用状況の画面に表示しました" : "利用状況の画面が開いていません（更新前の古い画面なら、リロードしてください）");
  if (w.failed) missing.push("メイン画面で元に戻せませんでした（" + w.failed + "）");
  toast([...parts, ...missing].join("／") + "（セッション " + w.sid.slice(0, 8) + "）", missing.length > 0);
}
function onReplayAck(kind, data) {
  if (!replayWait || data.sid !== replayWait.sidFull) return;
  if (kind === "user") replayWait.gotUser = true; else if (kind === "report") replayWait.gotReport = true; else if (kind === "failed") { replayWait.failed = data.message || "不明"; }
  if ((!replayWait.wantUser || replayWait.gotUser || replayWait.failed) && (!replayWait.wantReport || replayWait.gotReport)) settleReplay();
}
if (userCh) userCh.onmessage = e => { if (e.data && e.data.type === "restored") onReplayAck("user", e.data); else if (e.data && e.data.type === "restore-failed") onReplayAck("failed", e.data); };
if (window.Shell && Shell.channel) Shell.channel.onmessage = e => { if (e.data && e.data.type === "ack") onReplayAck("report", e.data); };
function sendReplay(d, wantUser) {
  clearTimeout(replayTimer);
  replayWait = { sidFull: d.sid, sid: d.sid, wantUser, wantReport: true, gotUser: false, gotReport: false, failed: null };
  if (wantUser && userCh) userCh.postMessage({ type: "restore", data: d });
  if (window.Shell && Shell.channel) Shell.channel.postMessage({ type: "replay", sid: d.sid });
  replayTimer = setTimeout(settleReplay, 1500);
}
function askRestore(d) { // 確認：メイン画面の今の表示は置き換わる
  const old = document.getElementById("rconfirm"); if (old) old.remove();
  const box = document.createElement("div"); box.id = "rconfirm";
  box.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px";
  const when = new Date(d.savedAt).toLocaleString("ja-JP");
  box.innerHTML = `<div style="background:#fff;border-radius:10px;max-width:460px;width:100%;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.3)">
    <div style="font-weight:600;margin-bottom:6px">このセッションを元に戻しますか？</div>
    <div class="note" style="margin-bottom:10px">セッション ${esc(d.sid.slice(0, 8))}（${esc(d.by)}／${esc(when)}）${d.reconstructed ? "<br>ログからの復元です。面積・地価などは今の画面の値になります。" : ""}</div>
    <div style="font-size:13px;margin-bottom:14px">開いている<b>メイン画面の今の表示は、このセッションの内容に置き換わります</b>。AIの返事は、記録にある本物の文です（Claudeは呼びません）。戻したあとの操作は、新しい体験として記録されます。</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end">
      <button class="act" id="rcBoth" style="background:#1d6fb8;border-color:#1d6fb8">メイン画面と利用状況を元に戻す</button>
      <button class="act" id="rcReport" style="background:#fff;color:#1d6fb8;border-color:#1d6fb8">利用状況の画面だけ</button>
      <button class="act" id="rcCancel" style="background:#fff;color:#444;border-color:#bbb">やめる</button>
    </div></div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.querySelector("#rcBoth").onclick = () => { close(); sendReplay(d, true); };
  box.querySelector("#rcReport").onclick = () => { close(); sendReplay(d, false); };
  box.querySelector("#rcCancel").onclick = close;
  box.onclick = e => { if (e.target === box) close(); };
}
async function replay(sid) {
  try {
    const r = await fetch(BASE + "session?sid=" + encodeURIComponent(sid), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    askRestore(await r.json());
  } catch (e) { toast("このセッションを読み込めませんでした（" + e.message + "）", true); }
  return false;
}
const replayCell = s => s.canReplay ? `<a class="btn-user-link" href="#" onclick="return replay('${esc(s.sid)}')">再表示</a>` : '<span class="note">—</span>';
const rowAttr = s => s.canReplay ? ` class="replayable" data-sid="${esc(s.sid)}" title="押すと、このセッションを元に戻します（開いているメイン画面と利用状況の画面）"` : "";
function bars(rows, valf, labf, fmt) {
  const max = Math.max(...rows.map(valf), 1e-9);
  return `<table>${rows.map(r => `<tr><td style="width:34%">${esc(labf(r))}</td><td><div class="barbox"><div class="bar" style="width:${Math.max(1, valf(r) / max * 100)}%"></div><span class="note">${fmt(r)}</span></div></td></tr>`).join("") || `<tr><td class="note">まだありません</td></tr>`}</table>`;
}

function viewCost() {
  const T = D.totals, C = D.config, cap = C.dailyCap, used = C.spentToday;
  const rej = Object.entries(D.rejected).map(([k, n]) => `${REASON[k] || k} ${n}回`).join("、") || "なし";
  const perDay = {};
  for (const x of D.days) perDay[x.day] = (perDay[x.day] || 0) + x.est;
  const dayRows = Object.entries(perDay).slice(0, 14).map(([day, est]) => ({ day, est }));
  const costSort = window.costSort || "new"; // 新しい順／費用の大きい順
  const top = D.sessions.filter(actorOk).sort((a, b) => costSort === "cost" ? b.est - a.est : (b.last || "").localeCompare(a.last || "")); // 開いた時点からのセッションすべて（AIを呼ぶまでは費用「—」）
  return `
  <div class="cards">
    <div class="card"><div class="t">今日（日本時間）</div><div class="v">${jpy(T.today.est)}</div><div class="s">${usd(T.today.est)} ／ ${T.today.rounds}往復</div></div>
    <div class="card"><div class="t">今月</div><div class="v">${jpy(T.month.est)}</div><div class="s">${usd(T.month.est)} ／ ${T.month.rounds}往復</div></div>
    <div class="card"><div class="t">通算</div><div class="v">${jpy(T.all.est)}</div><div class="s">${usd(T.all.est)} ／ ${T.all.rounds}往復</div></div>
    <div class="card"><div class="t">今日の上限に対する使用</div><div class="v">${(used / cap * 100).toFixed(1)}%</div><div class="s">${usd(used, 3)} / ${usd(cap, 2)}（超えると自動で止まる）</div></div>
    <div class="card"><div class="t">残高の見込み</div><div class="v">${D.balanceNow == null ? "未記録" : usd(D.balanceNow, 2)}</div><div class="s">${D.balanceNow == null ? "「設定」で Console の残高を記録" : jpy(D.balanceNow) + "（最後の記録＋その後の推定）"}</div></div>
    <div class="card"><div class="t">今日 止まった・失敗</div><div class="v">${Object.values(D.rejected).reduce((a, b) => a + b, 0) + D.errorsToday}</div><div class="s">止まった: ${esc(rej)} ／ エラー ${D.errorsToday}</div></div>
  </div>
  <div class="two">
    <div><h2>日ごとの推定費用（直近14日）</h2>${bars(dayRows, r => r.est, r => r.day, r => `${usd(r.est)}（${jpy(r.est)}）`)}</div>
    <div><h2>誰の利用か</h2><div class="scroll"><table><tr><th>名前（?by=）</th><th class="n">セッション</th><th class="n">AIと対話</th><th class="n">往復</th><th class="n">推定費用</th></tr>
      ${D.actors.sort((a, b) => b.est - a.est).map(a => `<tr><td>${esc(a.by)}</td><td class="n">${a.sessions}</td><td class="n">${a.withAi}</td><td class="n">${a.rounds}</td><td class="n">${money(a.est)}</td></tr>`).join("")}</table></div>
      <div class="note">visitor＝一般の訪問者。claude-code・owner など名前を付けた利用は、テストとして分けて見られます。</div></div>
  </div>
  <h2>セッションと費用（${top.length}件・開いた時点から）</h2>
  <div class="note">画面を開いた時点から行が入り、動きのたびに「進んだ所」が変わります。費用は④で AI が返事をしてから付きます。「時刻」は開始〜最後の動き。行を押すと、このセッションを元に戻します（開いているメイン画面と利用状況の画面。先に確認が出ます）。　${actorSelect()}　並び順：<select id="csort"><option value="new" ${costSort === "new" ? "selected" : ""}>新しい順</option><option value="cost" ${costSort === "cost" ? "selected" : ""}>費用の大きい順</option></select></div>
  <div class="scroll"><table><tr><th>時刻</th><th>誰</th><th>進んだ所</th><th class="n">往復</th><th class="n">入力</th><th class="n">出力</th><th class="n">推定</th><th class="n">実績</th><th>最初の言葉</th><th>再表示</th></tr>
  ${top.map(s => `<tr${rowAttr(s)}><td>${tm(s.started)}${s.last && s.last !== s.started ? "<br><span class=\"note\">〜" + tm(s.last).split(" ").pop() + "</span>" : ""}</td><td>${esc(s.by)}</td><td>${esc(stageOf(s))}</td><td class="n">${s.rounds || "—"}</td><td class="n">${s.rounds ? num(s.inTok) : "—"}</td><td class="n">${s.rounds ? num(s.outTok) : "—"}</td><td class="n">${s.rounds ? money(s.est) : "—"}</td><td class="n">${actual(s)}</td><td>${esc((s.first || "").replace(/\n/g, " ").slice(0, 60))}</td><td>${replayCell(s)}</td></tr>`).join("") || `<tr><td colspan="10" class="note">まだありません</td></tr>`}</table></div>
  <h2>Console との突き合わせ（日ごと・Console の日の区切り：${D.lots.tz === "UTC" ? "UTC＝日本時間9時切り替え" : "日本時間"}）</h2>
  <div class="note">トークン数は、こちらの記録と Console が同じものを数えているので、ぴったり合うはずです（合わなければ記録の漏れ）。金額は推定なので、ずれは単価の見直し材料です。Console の数字は「設定」で入れます。</div>
  <div class="scroll"><table><tr><th>日</th><th class="n">往復</th><th class="n">入力（こちら）</th><th class="n">入力（Console）</th><th class="n">出力（こちら）</th><th class="n">出力（Console）</th><th class="n">推定</th><th class="n">実績（Console）</th><th class="n">比（実績÷推定）</th></tr>
  ${D.lots.days.map(x => { const L = x.console, tk = (a, b) => b == null ? '<span class="note">未入力</span>' : num(b) + (b === a ? ' <span class="pill ok">一致</span>' : ' <span class="pill warn">差 ' + num(b - a) + '</span>'); return `<tr><td>${x.day}</td><td class="n">${x.rounds}</td><td class="n">${num(x.inTok)}${x.cacheRead || x.cacheCreate ? `<br><span class="note">キャッシュ 読${num(x.cacheRead)}・書${num(x.cacheCreate)}</span>` : ""}</td><td class="n">${L ? tk(x.inTok, L.inTok) : '<span class="note">—</span>'}</td><td class="n">${num(x.outTok)}</td><td class="n">${L ? tk(x.outTok, L.outTok) : '<span class="note">—</span>'}</td><td class="n">${money(x.est)}</td><td class="n">${L ? money(L.usd) : '<span class="note">未入力</span>'}</td><td class="n">${x.ratio == null ? "—" : x.ratio.toFixed(2)}</td></tr>`; }).join("") || `<tr><td colspan="9" class="note">まだありません</td></tr>`}</table></div>
  <h2>日別の内訳（日本時間・誰の利用か別）</h2>
  <div class="scroll"><table><tr><th>日</th><th>誰</th><th class="n">セッション</th><th class="n">往復</th><th class="n">入力</th><th class="n">出力</th><th class="n">推定</th><th class="n">金額</th></tr>
  ${D.days.slice(0, 40).map(x => `<tr><td>${x.day}</td><td>${esc(x.by)}</td><td class="n">${x.sessions}</td><td class="n">${x.rounds}</td><td class="n">${num(x.inTok)}</td><td class="n">${num(x.outTok)}</td><td class="n">${money(x.est)}</td><td class="n">${x.fixed ? money(x.usd) + ' <span class="pill ok">確定</span>' : '<span class="note">推定のみ</span>'}</td></tr>`).join("")}</table></div>`;
}

function viewExplain() {
  const E = D.explain, base = E.visitor.n >= 5 ? E.visitor : E.all, label = E.visitor.n >= 5 ? "一般の訪問者（visitor）" : "全体（テスト含む）";
  if (!base.n) return `<div class="warnbox">まだ AI と対話したセッションがありません。試してもらうと、ここに費用の目安が出ます。</div>`;
  const few = base.n < 20 ? `<div class="warnbox">サンプルが ${base.n} 件と少ないので、参考値です（20件を超えると落ち着きます）。</div>` : "";
  const scen = [50, 100, 300, 1000, 3000];
  return `${few}
  <h2>相談1件あたりの費用（${esc(label)}、${base.n}件）</h2>
  <div class="note">「相談1件」＝ 利用者が画面を開いて AI と対話した 1 セッション。モデル: ${esc(E.model)}</div>
  <div class="cards" style="margin-top:8px">
    <div class="card"><div class="t">平均</div><div class="v">${jpy(base.avgUsd)}</div><div class="s">${usd(base.avgUsd)}</div></div>
    <div class="card"><div class="t">中央値</div><div class="v">${jpy(base.p50)}</div><div class="s">半分の相談はこれ以下</div></div>
    <div class="card"><div class="t">多めの場合（上位10%）</div><div class="v">${jpy(base.p90)}</div><div class="s">${usd(base.p90)}</div></div>
    <div class="card"><div class="t">1件あたりの往復数</div><div class="v">${base.avgRounds.toFixed(1)}回</div><div class="s">入力 ${num(base.avgIn)} / 出力 ${num(base.avgOut)} トークン</div></div>
  </div>
  <h2>導入後の月額の試算（AI利用分のみ）</h2>
  <div class="scroll"><table><tr><th>1か月の相談件数</th><th class="n">平均で見ると</th><th class="n">多めで見ると</th></tr>
  ${scen.map(n => `<tr><td>${n.toLocaleString()}件</td><td class="n">${jpy(base.avgUsd * n)}</td><td class="n">${jpy(base.p90 * n)}</td></tr>`).join("")}</table></div>
  <div class="note">為替は 1ドル＝${E.usdJpy}円（設定で変更）。サーバー・保守などの費用は含みません。推定値で、実額との差は「設定」の区間比較で確認します。</div>
  <h2>モデルを変えた場合の目安（同じトークン量で単価だけ置き換えた試算）</h2>
  <div class="scroll"><table><tr><th>モデル</th><th class="n">相談1件</th><th class="n">月300件</th></tr>
  ${E.models.map(m => `<tr><td>${esc(m.model)}${m.model === E.model ? ' <span class="pill ok">今の設定</span>' : ""}</td><td class="n">${jpy(m.perSessionUsd)}</td><td class="n">${jpy(m.perSessionUsd * 300)}</td></tr>`).join("")}</table></div>
  <div class="note">返事の質・長さはモデルで変わるため、実際に試して決める前提の参考値です。</div>`;
}

function viewTested() {
  const T = D.tested, bys = Object.keys(T.funnel);
  const sel = window.fSel && T.funnel[window.fSel] ? window.fSel : "_all";
  const f = T.funnel[sel], top = Math.max(f[0].sessions, 1);
  const list = (rows, empty = "まだありません") => rows.length ? `<table>${rows.slice(0, 15).map(r => `<tr><td>${esc(r.k)}</td><td class="n">${r.n}</td></tr>`).join("")}</table>` : `<div class="note">${empty}</div>`;
  return `
  <h2>どこまで進んだか（セッション数）</h2>
  <div class="note">対象: <select id="fsel">${bys.map(b => `<option value="${esc(b)}" ${b === sel ? "selected" : ""}>${b === "_all" ? "全部" : esc(b)}</option>`).join("")}</select>　①〜③は AI を呼ばないため、画面の動きの記録から数えています。</div>
  ${bars(f, r => r.sessions, r => STAGE[r.stage], r => `${r.sessions}件（${(r.sessions / top * 100).toFixed(0)}%）`)}
  <div class="two">
    <div><h2>④で選ばれた相談目的</h2>${list(T.purposes)}<h3>相談の方向（枝）</h3>${list(T.branches)}</div>
    <div><h2>⑤以降に押されたボタン</h2>${list(T.later)}<h3>①〜③の答え</h3>${list(T.roads)}</div>
    <div><h2>試された地域（市区町村）</h2>${list(T.places)}<h3>最寄りの標準地</h3>${list(T.near)}</div>
    <div><h2>画面の幅・来た経路</h2>${list(T.devices)}<h3>参照元</h3>${list(T.refs)}</div>
  </div>
  <h2>書かれた言葉の傾向（仮の分類：キーワード）</h2>
  <div class="two"><div>${list(T.themes, "書かれた言葉はまだありません")}</div>
  <details><summary class="note">分類の規則を見る（正規表現）</summary>${D.themeRules.map(r => `<div class="note">${esc(r.name)}：${esc(r.rule)}</div>`).join("")}<div class="note">どれにも当たらないものは「その他」。</div></details></div>
  <h2>書かれた言葉（新しい順・最大150件）</h2>
  <div class="scroll"><table><tr><th>時刻</th><th>誰</th><th>段階</th><th>分類</th><th>書かれた言葉</th></tr>
  ${T.texts.map(x => `<tr><td>${tm(x.ts)}</td><td>${esc(x.by)}</td><td>${"①②③④⑤⑥⑦⑧"[x.q - 1] || x.q}</td><td><span class="pill">${esc(x.theme)}</span></td><td>${esc(x.text)}</td></tr>`).join("") || `<tr><td colspan="5" class="note">まだありません</td></tr>`}</table></div>`;
}

function viewSessions() {
  const live = s => !s.ended && s.last && Date.now() - new Date(s.last).getTime() < 30 * 60000; // 最後の動きから30分以内
  const st = s => live(s) ? '<span class="pill ok">進行中</span>' : s.ended ? '<span class="pill">終了</span>' : '<span class="pill">離脱</span>';
  return `
  <h2>セッション（新しい順・最大300件）</h2>
  <div class="note">${actorSelect()}</div>
  <div class="note">進行中＝最後の動きから30分以内。終了＝画面を閉じた記録あり。離脱＝閉じた記録なしで30分以上動きなし。</div>
  <div class="scroll"><table><tr><th>最後の動き</th><th>状態</th><th>誰</th><th>場所</th><th>到達</th><th>方向</th><th class="n">往復</th><th class="n">止/エラー</th><th class="n">推定費用</th><th>最初の言葉</th><th>再表示</th></tr>
  ${D.sessions.filter(actorOk).map(s => `<tr${rowAttr(s)}><td>${tm(s.last)}</td><td>${st(s)}</td><td>${esc(s.by)}</td><td>${esc(s.place)}</td><td>${esc(stageOf(s))}</td><td>${esc(s.branch)}</td><td class="n">${s.rounds}</td><td class="n">${s.rejected + s.errors}</td><td class="n">${s.rounds ? money(s.est) : "—"}</td><td>${esc((s.first || "").replace(/\n/g, " ").slice(0, 50))}</td><td>${replayCell(s)}</td></tr>`).join("") || `<tr><td colspan="11" class="note">まだありません</td></tr>`}</table></div>
  <h2>最近のやり取り（200件まで・本文つき）</h2>
  ${D.turns.map(t => `<details><summary>${tm(t.ts)} ／ ${esc(t.by)} ／ ${t.status === "ok" ? "" : `<span class="pill warn">${esc(t.status)}${t.reason ? "：" + esc(REASON[t.reason] || t.reason) : ""}</span> ／ `}${t.q ? "①②③④⑤⑥⑦⑧"[t.q - 1] + " " : ""}${t.typed && !t.press ? '<span class="pill">書いて送った</span> ' : ""}${t.branchBy === "ai" ? '<span class="pill">枝はAI</span> ' : ""}${esc((t.user || "").replace(/\n/g, " ").slice(0, 70))} <span class="note">${t.status === "ok" ? `入${num(t.inTok)}・出${num(t.outTok)}・${usd(t.est)}・${((t.ms || 0) / 1000).toFixed(1)}秒` : ""}</span></summary><pre><b>利用者:</b> ${esc(t.user)}\n<b>AI:</b> ${esc(t.reply || "（返事なし）")}</pre></details>`).join("") || '<div class="note">まだありません</div>'}`;
}

function viewSettings() {
  const v = D.prices[D.prices.length - 1];
  const days = D.lots.days.map(x => x.day);
  return `
  <h2>Console の日ごとの数字（実績のもと）</h2>
  <div class="note">Console の「コスト」「使用量」の画面に出ている、日ごとの金額（必須）と、入力・出力トークン（あれば）を写してください。入れた日は、その日の往復へ推定の割合で割り振られて「確定」になります。金額を空にして保存すると、その日の記録を消します。</div>
  <p>Console の日の区切り：<select id="lotTz"><option value="UTC" ${D.lots.tz === "UTC" ? "selected" : ""}>UTC（日本時間 9:00 に日が変わる）</option><option value="JST" ${D.lots.tz === "JST" ? "selected" : ""}>日本時間（0:00 に日が変わる）</option></select> <button class="act" id="tzSave">保存</button> <span id="tzMsg" class="note"></span></p>
  <p><input id="lotDay" type="date" value="${esc(days[0] || "")}" style="width:150px"> 金額 <input id="lotUsd" type="number" step="0.0001" min="0" placeholder="例：0.0610" style="width:110px"> ドル　入力 <input id="lotIn" type="number" min="0" step="1" placeholder="トークン" style="width:110px">　出力 <input id="lotOut" type="number" min="0" step="1" placeholder="トークン" style="width:110px"> <button class="act" id="lotSave">保存</button> <span id="lotMsg" class="note"></span></p>
  <div class="scroll"><table><tr><th>日</th><th class="n">金額</th><th class="n">入力</th><th class="n">出力</th><th>入れた時刻</th></tr>${D.lots.days.filter(x => x.console).map(x => `<tr><td>${x.day}</td><td class="n">${usd(x.console.usd)}</td><td class="n">${x.console.inTok == null ? "—" : num(x.console.inTok)}</td><td class="n">${x.console.outTok == null ? "—" : num(x.console.outTok)}</td><td>${tm(x.console.ts)}</td></tr>`).join("") || `<tr><td colspan="5" class="note">まだ入れていません</td></tr>`}</table></div>
  <h2>残高の記録（実額との突き合わせ）</h2>
  <div class="note">Console の「組織のクレジット」の金額を入れてください。記録の間の実際の減少額が、その間の往復へ推定額の割合で割り振られ（確定）、実額と推定の差が下に出ます。ずれは調査データです。</div>
  <p><input id="balAmt" type="number" step="0.01" min="0" placeholder="例：9.62" style="width:120px"> ドル <input id="balNote" type="text" placeholder="メモ（例：初回確認）" style="width:260px"> <button class="act" id="balSave">記録する</button> <span id="balMsg" class="note"></span></p>
  <div class="scroll"><table><tr><th>記録した時刻</th><th class="n">残高</th><th>メモ</th></tr>${D.balances.slice().reverse().map(b => `<tr><td>${tm(b.ts)}</td><td class="n">${usd(b.amount_usd, 2)}</td><td>${esc(b.note)}</td></tr>`).join("") || `<tr><td colspan="3" class="note">まだ記録がありません</td></tr>`}</table></div>
  <h3>区間ごとの実額と推定</h3>
  <div class="scroll"><table><tr><th>区間</th><th class="n">実際に減った額</th><th class="n">推定</th><th class="n">差</th><th class="n">比（実額÷推定）</th><th class="n">往復</th></tr>${D.segments.map(s => `<tr><td>${tm(s.from)} → ${tm(s.to)}</td><td class="n">${usd(s.spent)}</td><td class="n">${usd(s.est)}</td><td class="n">${usd(s.diff)}</td><td class="n">${s.ratio == null ? "—" : s.ratio.toFixed(2)}</td><td class="n">${s.rounds}</td></tr>`).join("") || `<tr><td colspan="6" class="note">残高を2回以上記録すると出ます</td></tr>`}</table></div>
  <h2>為替</h2>
  <p>1ドル = <input id="rate" type="number" min="50" max="500" step="0.1" value="${D.config.usdJpy}" style="width:90px"> 円 <button class="act" id="rateSave">保存</button> <span id="rateMsg" class="note"></span></p>
  <h2>単価（USD / 100万トークン）</h2>
  <div class="note">保存すると「今から有効な新しい版」になり、過去の往復は当時の単価のままです。キャッシュ読み出しは未設定なら入力の0.1倍（仮説）。</div>
  <div class="scroll"><table id="ptable"><tr><th>モデル名（前方一致）</th><th class="n">入力</th><th class="n">出力</th></tr>${v.models.map(m => `<tr><td><input class="pm" value="${esc(m.model)}" style="width:220px"></td><td class="n"><input class="pi" type="number" step="0.01" value="${m.input}" style="width:80px"></td><td class="n"><input class="po" type="number" step="0.01" value="${m.output}" style="width:80px"></td></tr>`).join("")}</table></div>
  <p><button class="act" id="priceSave">新しい版として保存</button> <span id="priceMsg" class="note"></span> <span class="note">（版の数：${D.prices.length}、最新の有効開始：${tm(v.from)}）</span></p>
  <h2>現在の設定（読み取り）</h2>
  <div class="note">モデル ${esc(D.config.model)} ／ 1日の費用上限 ${usd(D.config.dailyCap, 2)} ／ 停止スイッチ：${D.config.disabled ? "停止中" : "稼働中"}（止めるには <code>data/DISABLED</code> というファイルを置く）</div>`;
}

async function post(path, body) {
  const r = await fetch(BASE + path, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  return r.ok;
}
document.addEventListener("click", e => {
  const tr = e.target.closest("tr.replayable");
  if (!tr || e.target.closest("a")) return;
  if (window.getSelection && String(window.getSelection())) return; // 文字を選んでいるときは何もしない
  replay(tr.dataset.sid);
});
function bind() {
  const $ = id => document.getElementById(id);
  if ($("asel")) $("asel").onchange = e => { window.actorSel = e.target.value; render(); };
  if ($("csort")) $("csort").onchange = e => { window.costSort = e.target.value; render(); };
  if ($("fsel")) $("fsel").onchange = e => { window.fSel = e.target.value; render(); };
  if ($("balSave")) $("balSave").onclick = async () => { const ok = await post("balance", { amount_usd: +$("balAmt").value, note: $("balNote").value }); $("balMsg").textContent = ok ? "記録しました" : "入力を確認してください"; if (ok) load(); };
  if ($("tzSave")) $("tzSave").onclick = async () => { const ok = await post("consoletz", { tz: $("lotTz").value }); $("tzMsg").textContent = ok ? "保存しました" : "保存できませんでした"; if (ok) load(); };
  if ($("lotSave")) $("lotSave").onclick = async () => { const ok = await post("consoleday", { day: $("lotDay").value, usd: $("lotUsd").value, inTok: $("lotIn").value, outTok: $("lotOut").value }); $("lotMsg").textContent = ok ? "保存しました" : "日付と金額を確認してください"; if (ok) load(); };
  if ($("rateSave")) $("rateSave").onclick = async () => { const ok = await post("settings", { usdJpy: +$("rate").value }); $("rateMsg").textContent = ok ? "保存しました" : "50〜500の数字で入れてください"; if (ok) load(); };
  if ($("priceSave")) $("priceSave").onclick = async () => {
    const models = [...document.querySelectorAll("#ptable tr")].slice(1).map(tr => ({ model: tr.querySelector(".pm").value.trim(), input: +tr.querySelector(".pi").value, output: +tr.querySelector(".po").value }));
    const ok = await post("prices", { models }); $("priceMsg").textContent = ok ? "新しい版として保存しました" : "入力を確認してください"; if (ok) load();
  };
}
function render() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, n]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${n}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; location.hash = tab; if (stale) { stale = false; load(); } else render(); });
  const st = document.getElementById("state");
  st.textContent = D.config.disabled ? "停止中" : "稼働中"; st.className = "pill " + (D.config.disabled ? "warn" : "ok");
  document.getElementById("upd").textContent = "集計: " + new Date(D.computedAt).toLocaleTimeString("ja-JP") + "（動きがあるたびに更新）";
  document.getElementById("main").innerHTML = ({ cost:viewCost, explain:viewExplain, tested:viewTested, sessions:viewSessions, settings:viewSettings }[tab] || viewCost)();
  bind();
}
async function load() {
  try {
    const r = await fetch(BASE + "summary", { cache:"no-store" });
    if (!r.ok) throw new Error(r.status);
    D = await r.json(); render();
  } catch (e) { document.getElementById("main").innerHTML = `<div class="warnbox">読み込めませんでした（${esc(e.message)}）。ページを開き直してください。</div>`; }
}
document.getElementById("reload").onclick = load;
// メイン画面で動きがあるたびに読み直す（同じブラウザで開いているメイン画面からの合図）。窓が前に出たときも読み直す。
// 設定タブで書いている途中・元に戻す確認の途中は、書き換えない（次にタブを移ったときに読み直す）。開いていた「詳しく」は開いたままにする。
let stale = false, liveTimer = null;
function liveLoad() {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(async () => {
    const a = document.activeElement;
    if (tab === "settings" || document.getElementById("rconfirm") || (a && a.closest && a.closest("#main input, #main textarea"))) { stale = true; return; }
    const opened = new Set([...document.querySelectorAll("#main details[open] > summary")].map(x => x.textContent));
    stale = false; await load();
    document.querySelectorAll("#main details > summary").forEach(x => { if (opened.has(x.textContent)) x.parentElement.open = true; });
  }, 400);
}
const devCh = "BroadcastChannel" in window ? new BroadcastChannel("reDev") : null;
if (devCh) devCh.onmessage = e => { if (e.data && e.data.type === "saved") liveLoad(); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") liveLoad(); });
// 別のパソコンの動きも拾うため、数秒ごとにサーバーへ「変わったか」だけを聞く（集計はしない軽い問い合わせ）。窓が隠れている間は聞かない
let lastSeq = null;
setInterval(async () => {
  if (document.visibilityState !== "visible") return;
  try {
    const r = await fetch(BASE + "stamp", { cache:"no-store" }); if (!r.ok) return;
    const { seq } = await r.json();
    if (lastSeq !== null && seq !== lastSeq) liveLoad();
    lastSeq = seq;
  } catch (e) { /* 次の回に聞き直す */ }
}, 3000);
load();
</script>
</body>
</html>
